name: Cancel closed PR runs

on:
    pull_request_target: # zizmor: ignore[dangerous-triggers]
        types: [closed]

permissions:
    actions: write

jobs:
    cancel-closed:
        name: Cancel closed PR runs
        # Trusted base workflow only; never checks out or executes PR code.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
              with:
                  script: |
                      const pr = context.payload.pull_request;
                      const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                        ...context.repo, branch: pr.head.ref, event: 'pull_request', per_page: 100,
                      });
                      for (const run of runs) {
                        if (run.id === context.runId || run.status === 'completed') continue;
                        const samePR = run.pull_requests.some(item => item.number === pr.number);
                        const sameSource = run.head_repository?.id === pr.head.repo?.id && run.head_branch === pr.head.ref;
                        if (samePR || (!run.pull_requests.length && sameSource)) {
                          try {
                            await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
                          } catch (error) {
                            if (error.status !== 409) throw error; // It completed after the snapshot.
                          }
                        }
                      }
