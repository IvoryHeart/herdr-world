name: Installer upgrades

on:
  workflow_call:
    inputs:
      baseline_tag:
        required: true
        type: string
      baseline_sha:
        required: true
        type: string
      candidate_version:
        required: true
        type: string
      build_hash:
        required: true
        type: string
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  release-walk:
    uses: ./.github/workflows/release-walk.yml

  baseline:
    name: Freeze latest stable installer baseline
    # CI freezes this in Validation scope so native jobs start together. Keep
    # the resolver for standalone dispatches, with the same immutable outputs.
    if: inputs.baseline_sha == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.baseline_tag }}
      sha: ${{ steps.plan.outputs.baseline_sha }}
      version: ${{ steps.plan.outputs.candidate_version }}
      hash: ${{ steps.plan.outputs.build_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Resolve the latest published stable release once
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/installer-upgrade.ts plan

  upgrade:
    name: Installer upgrade (${{ matrix.platform }})
    needs: baseline
    if: always() && (needs.baseline.result == 'success' || (needs.baseline.result == 'skipped' && inputs.baseline_sha != ''))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-latest
          - platform: windows-arm64
            runner: windows-11-arm
    env:
      HERDR_WORLD_BUILD_VERSION: ${{ inputs.candidate_version || needs.baseline.outputs.version }}
      INSTALLER_BUILD_HASH: ${{ inputs.build_hash || needs.baseline.outputs.hash }}
      INSTALLER_BASELINE_TAG: ${{ inputs.baseline_tag || needs.baseline.outputs.tag }}
      INSTALLER_BASELINE_SHA: ${{ inputs.baseline_sha || needs.baseline.outputs.sha }}
      INSTALLER_BASELINE_DIR: ${{ github.workspace }}/.agents/worktrees/installer-baseline
      INSTALLER_CANDIDATE_SHA: ${{ github.sha }}
      INSTALLER_BASELINE_ASSETS: ${{ github.workspace }}/.agents/installer-baseline-assets
    steps:
      # For pull requests, checkout's default is the proposed merge revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.baseline_sha || needs.baseline.outputs.sha }}
          path: .agents/worktrees/installer-baseline
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      # Linux installs take seconds; Windows and macOS spend up to 90 s
      # downloading packages. CI runs only for pull requests, so a cache serves
      # later pushes to the same pull request.
      - name: Cache Bun packages
        if: runner.os != 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Verify native SQLite and standalone compiled worker crash recovery
        env:
          HERDR_TEST_PARALLEL: "1"
          HERDR_TEST_MAX_CONCURRENCY: "1"
        run: >-
          bun run test
          ./server/src/storage/world-storage.test.ts
          ./server/src/storage/world-storage-crash.test.ts
          ./server/src/storage/world-writer.test.ts
          ./server/src/storage/answer-transitions.test.ts
          ./server/src/storage/answer-migration.test.ts
          ./server/src/storage/answer-delivery-crash.test.ts
          ./server/src/storage/runtime-status-crash.test.ts
          ./server/src/storage/board-crash.test.ts
          ./server/src/storage/profile-crash.test.ts
          ./server/src/storage/terminal-marks-crash.test.ts
      - name: Run native installer harness regressions
        if: runner.os == 'Windows'
        run: bun run test ./scripts/installer-upgrade.test.ts
      # The published baseline never changes for a tag: download it once per
      # platform instead of on every run (see releaseMirror).
      - name: Cache the baseline release assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .agents/installer-baseline-assets
          key: installer-baseline-${{ inputs.baseline_tag || needs.baseline.outputs.tag }}-${{ matrix.platform }}
      - name: Restore the exact content-keyed native package
        id: package-cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist
            server/herdr-world-*
          key: installer-build-v1-${{ matrix.platform }}-${{ env.ImageVersion }}-${{ env.INSTALLER_BASELINE_TAG }}-${{ env.INSTALLER_BUILD_HASH }}
      - name: Build the proposed merge with the release packaging script
        if: steps.package-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/package-release.sh "$PACKAGE_PLATFORM"
      - name: Verify fresh installation and upgrade without Bun on the installer PATH
        env:
          INSTALLER_REPORT_DIR: ${{ runner.temp }}/installer-report
        run: bun scripts/installer-upgrade.ts verify
      # Feeds the existing native result required by Delivery checks. No new
      # protected report or branch-rule name; docs/reuse still skip native work.
      - name: Verify real Linux installations and reboot in systemd containers
        if: matrix.platform == 'linux-x64'
        run: bun run test:install-linux --reuse --version "$HERDR_WORLD_BUILD_VERSION" --require-docker
      - name: Verify Windows Bun-free plugin installation and frozen actions
        if: runner.os == 'Windows'
        run: bun run test scripts/install-plugin.windows.test.ts scripts/plugin-native.test.ts server/src/config/plugin-command.test.ts
      - name: Save the validated native build
        if: success() && steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist
            server/herdr-world-*
          key: installer-build-v1-${{ matrix.platform }}-${{ env.ImageVersion }}-${{ env.INSTALLER_BASELINE_TAG }}-${{ env.INSTALLER_BUILD_HASH }}
      - name: Compile the standalone plugin launcher
        if: runner.os == 'macOS'
        run: bun scripts/world-plugin.ts compile-launcher
      - name: Verify Bun-free installation and prepare the native compatibility launcher
        if: runner.os == 'macOS'
        run: |
            bun run test scripts/install-plugin.test.ts scripts/plugin-native.test.ts server/src/config/plugin-command.test.ts
            cp "server/herdr-world-${{ matrix.platform }}" server/herdr-world
            cp server/herdr-world server/herdr-world-plugin.exe
      - name: Exercise the real plugin-managed launchd lifecycle
        if: runner.os == 'macOS'
        shell: bash
        run: |
            set -euo pipefail
            plugin_launcher="$PWD/server/herdr-world-plugin.exe"

            cleanup() {
              PATH=/usr/bin:/bin "$plugin_launcher" uninstall >/dev/null 2>&1 || true
            }
            wait_until_ready() {
              for _ in {1..80}; do
                if curl --fail --silent --show-error \
                  http://127.0.0.1:8787/healthz >/dev/null; then
                  return 0
                fi
                sleep 0.25
              done
              echo "Herdr World did not become ready" >&2
              tail -n 100 "$HOME/Library/Logs/herdr-world.stderr.log" >&2 || true
              return 1
            }

            trap cleanup EXIT
            cleanup
            PATH=/usr/bin:/bin "$plugin_launcher" start
            wait_until_ready
            PATH=/usr/bin:/bin "$plugin_launcher" status
            PATH=/usr/bin:/bin "$plugin_launcher" restart
            wait_until_ready
            PATH=/usr/bin:/bin "$plugin_launcher" status
            PATH=/usr/bin:/bin "$plugin_launcher" uninstall
            test ! -e "$HOME/Library/LaunchAgents/dev.herdr-world.plist"
            trap - EXIT

      - name: Retain compact installer evidence
        id: installer_evidence
        if: always()
        # A transient artifact-service DNS failure must not discard a completed
        # native run. Retry once below; a second upload failure still fails CI.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installer-report
          retention-days: 1
          if-no-files-found: warn
      - name: Retry compact installer evidence upload
        if: always() && steps.installer_evidence.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installer-report
          retention-days: 1
          if-no-files-found: warn
          overwrite: true
