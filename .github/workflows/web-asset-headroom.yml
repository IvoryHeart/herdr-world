name: Web asset headroom

# Judges each PR's web asset delta against current main, not only the main it
# was tested on, so budget sums are caught before merge (scripts/web-asset-headroom.ts).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: web-asset-headroom-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  headroom:
    name: Web asset headroom
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
          no-cache: true
      - name: Judge the PR against its base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/web-asset-headroom.ts pr
      - name: Re-judge open PRs against the new main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/web-asset-headroom.ts main
