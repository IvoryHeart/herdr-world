name: Web asset headroom

# Judges each PR's web asset delta against current main, not only the main it
# was tested on, so budget sums are caught before merge (scripts/web-asset-headroom.ts).
# Only web build inputs start it; test files and fixtures never do.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["web/index.html", "web/herdr-setup-preview.html", "web/vite.config.ts", "web/tsconfig.json", "web/package.json", "web/public/**", "web/src/**", "!web/src/**/*.test.ts", "!web/src/**/*.test.tsx", "!web/src/**/*.browser.ts", "!web/src/**/*.browser.tsx", "!web/src/**/*.cases.ts", "!web/src/**/*.fixture.*", "!web/src/**/*.browserMock.*", "!web/src/**/testing/**", "shared/**", "!shared/**/*.test.ts", "package.json", "bun.lock", "scripts/build-version.ts", "scripts/precompress-assets.ts", "scripts/*web-asset*", ".github/workflows/web-asset-headroom.yml"]
  push:
    branches: [main]
    paths: ["web/index.html", "web/herdr-setup-preview.html", "web/vite.config.ts", "web/tsconfig.json", "web/package.json", "web/public/**", "web/src/**", "!web/src/**/*.test.ts", "!web/src/**/*.test.tsx", "!web/src/**/*.browser.ts", "!web/src/**/*.browser.tsx", "!web/src/**/*.cases.ts", "!web/src/**/*.fixture.*", "!web/src/**/*.browserMock.*", "!web/src/**/testing/**", "shared/**", "!shared/**/*.test.ts", "package.json", "bun.lock", "scripts/build-version.ts", "scripts/precompress-assets.ts", "scripts/*web-asset*", ".github/workflows/web-asset-headroom.yml"]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: web-asset-headroom-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  headroom:
    # Not the status's name: advisory "Web asset headroom" status, which a
    # main push can update after this job has finished.
    name: Measure web asset headroom
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history: a stacked PR's base is aligned with the main the PR
          # already contains (alignStackedBase).
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - name: Judge the PR against its base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: bun scripts/web-asset-headroom.ts pr
      - name: Re-judge open PRs against the new main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/web-asset-headroom.ts main
