name: Privacy

# Independent of PR creation, validation scope and the main-only full matrix.
# Every branch push is scanned, as a branch can be public without a PR; a push
# to a branch with an open PR leaves the scan to that PR's run, which scans the
# same commits, so each PR push is scanned once.
on:
    workflow_dispatch:
    push:
        branches: ["**"]
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read
    pull-requests: read

jobs:
    privacy:
        name: Privacy guard
        if: github.event.deleted != true
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Leave a branch with an open PR to its PR run
              id: pr
              if: github.event_name == 'push' && github.ref != 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
                  BRANCH: ${{ github.ref_name }}
              run: |
                  # An unreadable answer scans, as before.
                  open="$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$GITHUB_REPOSITORY_OWNER:$BRANCH" --jq length 2>/dev/null || echo 0)"
                  if [ "$open" != 0 ]; then
                    echo "covered=true" >> "$GITHUB_OUTPUT"
                    echo "This branch has an open PR; its run scans these commits."
                  fi
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              if: steps.pr.outputs.covered != 'true'
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  fetch-depth: 0
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              if: steps.pr.outputs.covered != 'true'
              with:
                  bun-version: "1.4.4"
                  no-cache: true
            - name: Scan every introduced commit without exposing matches
              if: steps.pr.outputs.covered != 'true'
              run: |
                  if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                    bun run check:privacy
                  else
                    bun scripts/check-privacy.ts --event "$GITHUB_EVENT_PATH"
                  fi
