name: World browser validation

on:
    workflow_call:
        inputs:
            lane:
                required: true
                type: string
            selection:
                required: true
                type: string
            stability:
                default: false
                type: boolean

permissions:
    contents: read

jobs:
    world-browser:
        name: World browser tests (${{ matrix.shard }}/6)
        if: inputs.lane == 'world' && toJSON(fromJSON(inputs.selection).world) != '[]'
        runs-on: ubuntu-latest
        timeout-minutes: ${{ inputs.stability && 45 || 15 }}
        strategy:
            fail-fast: false
            max-parallel: 6
            matrix:
                shard: ${{ fromJSON(inputs.selection).worldShards }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.4"
                  no-cache: true
            - run: bun install --frozen-lockfile
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/herdr-test-chrome
                  key: test-chrome-${{ hashFiles('tools/chrome/test-chrome.json') }}
            - name: Install the pinned test Chrome
              run: bun scripts/test-chrome.ts "$HOME/.cache/herdr-test-chrome"
            - name: Run World browser shard
              id: test-0
              continue-on-error: true
              env:
                  WORLD_TRACE_PREFIX: .agents/delivery/world-production
                  WORLD_TIMINGS_ONLY: "1"
                  HERDR_CI_SELECTION: ${{ inputs.selection }}
                  HERDR_WORLD_TEST_LABEL: shard-${{ matrix.shard }}-of-6
                  HERDR_CI_WORLD_RUNS: ${{ inputs.stability && '3' || '1' }}
              run: bun scripts/ci-tests.ts world ${{ matrix.shard }}
            - name: Retry failed test once
              if: steps.test-0.outcome == 'failure'
              env:
                  WORLD_TRACE_PREFIX: .agents/delivery/world-production
                  WORLD_TIMINGS_ONLY: "1"
                  HERDR_CI_SELECTION: ${{ inputs.selection }}
                  HERDR_WORLD_TEST_LABEL: shard-${{ matrix.shard }}-of-6
                  HERDR_CI_WORLD_RUNS: ${{ inputs.stability && '3' || '1' }}
              run: bun scripts/ci-tests.ts world ${{ matrix.shard }}
            - name: Upload World test results and timings
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: world-browser-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
                  path: |
                      .agents/delivery/world-shard-*.xml
                      .agents/delivery/world-shard-*.timings.json
                      .agents/delivery/world-production-*-inputs.json
                  include-hidden-files: true
                  if-no-files-found: warn
                  retention-days: 7

    # Two isolated files per runner; each case retains its own profile and state.
    web-shards:
        name: Web browser shard (${{ matrix.shard }}/2)
        if: inputs.lane == 'web' && toJSON(fromJSON(inputs.selection).web) != '[]'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.4"
                  no-cache: true
            - run: bun install --frozen-lockfile
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/herdr-test-chrome
                  key: test-chrome-${{ hashFiles('tools/chrome/test-chrome.json') }}
            - name: Install the pinned test Chrome
              run: bun scripts/test-chrome.ts "$HOME/.cache/herdr-test-chrome"
            - name: Run web browser suites
              id: test-1
              continue-on-error: true
              env:
                  HERDR_TEST_PARALLEL: "2"
                  HERDR_TEST_MAX_CONCURRENCY: "2"
                  HERDR_CI_SELECTION: ${{ inputs.selection }}
              run: bun scripts/ci-tests.ts web ${{ matrix.shard }}/2
            - name: Retry failed test once
              if: steps.test-1.outcome == 'failure'
              env:
                  HERDR_TEST_PARALLEL: "2"
                  HERDR_TEST_MAX_CONCURRENCY: "2"
                  HERDR_CI_SELECTION: ${{ inputs.selection }}
              run: bun scripts/ci-tests.ts web ${{ matrix.shard }}/2
            - name: Upload web browser test results
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: web-browser-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
                  path: .agents/delivery/web-browser-*.xml
                  include-hidden-files: true
                  if-no-files-found: warn
                  retention-days: 7
