name: World browser validation

on:
    workflow_call:
        inputs:
            selection:
                required: true
                type: string

permissions:
    contents: read

jobs:
    world-browser:
        name: World browser tests (${{ matrix.shard }}/6)
        if: toJSON(fromJSON(inputs.selection).world) != '[]'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            max-parallel: 6
            matrix:
                shard: ${{ fromJSON(inputs.selection).worldShards }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.3"
                  no-cache: true
            - run: bun install --frozen-lockfile
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/herdr-test-chrome
                  key: test-chrome-${{ hashFiles('tools/chrome/test-chrome.json') }}
            - name: Install the pinned test Chrome
              run: bun scripts/test-chrome.ts "$HOME/.cache/herdr-test-chrome"
            - name: Run World browser shard
              env:
                  WORLD_TRACE_PREFIX: .agents/delivery/world-production
                  WORLD_TIMINGS_ONLY: "1"
                  HERDR_CI_SELECTION: ${{ inputs.selection }}
                  HERDR_WORLD_TEST_LABEL: shard-${{ matrix.shard }}-of-6
              run: bun scripts/ci-tests.ts world ${{ matrix.shard }}
            - name: Upload World test results and timings
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: world-browser-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
                  path: |
                      .agents/delivery/world-shard-*.xml
                      .agents/delivery/world-shard-*.timings.json
                      .agents/delivery/world-production-*-inputs.json
                  include-hidden-files: true
                  if-no-files-found: warn
                  retention-days: 7

    # Chrome-driven suites outside World, one file at a time as in repository
    # validation, which leaves them out.
    web-shards:
        name: Web browser shard (${{ matrix.shard }}/2)
        if: toJSON(fromJSON(inputs.selection).web) != '[]'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.3"
                  no-cache: true
            - run: bun install --frozen-lockfile
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/herdr-test-chrome
                  key: test-chrome-${{ hashFiles('tools/chrome/test-chrome.json') }}
            - name: Install the pinned test Chrome
              run: bun scripts/test-chrome.ts "$HOME/.cache/herdr-test-chrome"
            - name: Run web browser suites
              env:
                  HERDR_TEST_PARALLEL: "1"
                  HERDR_TEST_MAX_CONCURRENCY: "2"
                  HERDR_CI_SELECTION: ${{ inputs.selection }}
              run: bun scripts/ci-tests.ts web ${{ matrix.shard }}/2
            - name: Upload web browser test results
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: web-browser-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
                  path: .agents/delivery/web-browser-*.xml
                  include-hidden-files: true
                  if-no-files-found: warn
                  retention-days: 7

    web-browser:
        name: Web browser tests
        needs: web-shards
        if: always() && toJSON(fromJSON(inputs.selection).web) != '[]'
        runs-on: ubuntu-latest
        steps:
            - env:
                  RESULT: ${{ needs.web-shards.result }}
              run: test "$RESULT" = success
