name: World browser validation

on:
    workflow_call:

permissions:
    contents: read

jobs:
    world-browser:
        name: World browser tests (${{ matrix.shard }}/8)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            max-parallel: 8
            matrix:
                shard: [1, 2, 3, 4, 5, 6, 7, 8]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.1"
                  no-cache: true
            - run: bun install --frozen-lockfile
            - name: Run World browser shard
              env:
                  WORLD_TRACE_PREFIX: .agents/delivery/world-production
                  WORLD_TIMINGS_ONLY: "1"
              run: bun run test:world --shard=${{ matrix.shard }}/8 --parallel=1 --max-concurrency=1
            - name: Upload World test results and timings
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: world-browser-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
                  path: |
                      .agents/delivery/world-shard-*.xml
                      .agents/delivery/world-shard-*.timings.json
                      .agents/delivery/world-production-*-inputs.json
                  include-hidden-files: true
                  if-no-files-found: warn
                  retention-days: 7
