name: Nightly native

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: nightly-native
  cancel-in-progress: false

jobs:
  native:
    uses: ./.github/workflows/release-candidate.yml
    with:
      version: nightly
      nightly: true
  signal:
    needs: native
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RESULT: ${{ needs.native.result }}
          CHANNEL_RESULT: ${{ needs.native.result }}
        run: bun scripts/nightly-native.ts
