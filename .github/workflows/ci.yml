name: CI

on:
    pull_request:
        types: [opened, synchronize, reopened, edited]
    # Prepare Release uses this explicit dispatch because events created with its
    # GITHUB_TOKEN do not start other workflows automatically.
    workflow_dispatch:

permissions:
    contents: read
    actions: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
    delivery:
        name: Delivery checks
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.1"
                  no-cache: true
            - name: Check knowledge-map impact
              if: github.event_name == 'pull_request'
              run: bun scripts/check-knowledge-map.ts "$GITHUB_EVENT_PATH"
            - name: Determine validation scope
              if: github.event_name == 'pull_request'
              id: scope
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_ACTION: ${{ github.event.action }}
                  REQUIRED_JOB_NAME: Delivery checks
                  REQUIRED_FULL_STEP: Run full repository check
              run: bun scripts/ci-reuse-full-check.ts
            - run: bun install --frozen-lockfile
              if: steps.scope.outputs.mode != 'reuse'
            - name: Run documentation checks
              if: steps.scope.outputs.mode == 'docs'
              run: bun run check:docs
            - name: Run full repository check
              if: steps.scope.outputs.mode != 'docs' && steps.scope.outputs.mode != 'reuse'
              run: bun run check

    launchd:
        name: macOS launchd plugin lifecycle (${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: arm64
                      runner: macos-15
                    - arch: x86_64
                      runner: macos-15-intel
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.1"
                  no-cache: true
            - name: Determine validation scope
              if: github.event_name == 'pull_request'
              id: scope
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_ACTION: ${{ github.event.action }}
                  REQUIRED_JOB_NAME: macOS launchd plugin lifecycle (${{ matrix.arch }})
                  REQUIRED_FULL_STEP: Exercise the real plugin-managed launchd lifecycle
              run: bun scripts/ci-reuse-full-check.ts
            - run: bun install --frozen-lockfile
              if: steps.scope.outputs.mode != 'docs' && steps.scope.outputs.mode != 'reuse'
            - name: Build the native World service
              if: steps.scope.outputs.mode != 'docs' && steps.scope.outputs.mode != 'reuse'
              run: bun run build
            - name: Exercise the real plugin-managed launchd lifecycle
              if: steps.scope.outputs.mode != 'docs' && steps.scope.outputs.mode != 'reuse'
              shell: bash
              run: |
                  set -euo pipefail

                  cleanup() {
                    bun scripts/world-plugin.ts uninstall >/dev/null 2>&1 || true
                  }
                  wait_until_ready() {
                    for _ in {1..80}; do
                      if curl --fail --silent --show-error \
                        http://127.0.0.1:8787/healthz >/dev/null; then
                        return 0
                      fi
                      sleep 0.25
                    done
                    echo "Herdr World did not become ready" >&2
                    tail -n 100 "$HOME/Library/Logs/herdr-world.stderr.log" >&2 || true
                    return 1
                  }

                  trap cleanup EXIT
                  cleanup
                  bun scripts/world-plugin.ts start
                  wait_until_ready
                  bun scripts/world-plugin.ts status
                  bun scripts/world-plugin.ts restart
                  wait_until_ready
                  bun scripts/world-plugin.ts status
                  bun scripts/world-plugin.ts uninstall
                  test ! -e "$HOME/Library/LaunchAgents/dev.herdr-world.plist"
                  trap - EXIT
