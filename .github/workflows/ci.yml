name: CI

on:
    pull_request:
        types: [opened, synchronize, reopened, edited, labeled]
    # The post-merge gate: every main commit gets the full check, and Main gate
    # reports a red one. Releases are cut only from a green main commit.
    push:
        branches: [main]
    # Prepare Release uses this explicit dispatch because events created with its
    # GITHUB_TOKEN do not start other workflows automatically.
    workflow_dispatch:
        inputs:
            browser_diagnostics:
                description: Compare browser lifecycle on the baseline and dispatched revision
                type: boolean
                default: false
            diagnostics_baseline:
                description: Baseline Git ref or commit for the browser comparison
                type: string
                default: main
            diagnostics_mode:
                description: Capture lifecycle events or only Chrome stderr
                type: choice
                options: [lifecycle, stderr]
                default: lifecycle

permissions:
    contents: read
    actions: read

concurrency:
    # Main pushes share one group: the running check finishes, and a batch of
    # merges queued behind it is tested once, at its newest commit (GitHub
    # keeps only the latest pending run). Main gate names every merge since the
    # last green commit when that run fails.
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && 'main-push') || github.ref }}
    # Metadata runs queue behind active validation and reuse the head's latest
    # result. A label must not cancel the check it needs as evidence.
    cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' && github.event.action != 'labeled' }}

jobs:
    browser-diagnostics:
        name: Browser lifecycle (${{ matrix.suite }}, ${{ matrix.order }})
        if: github.event_name == 'workflow_dispatch' && inputs.browser_diagnostics
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            max-parallel: 3
            matrix:
                suite: [HostsFilter.creation, BoardView, useSpacesTabWindowArrangement.browser]
                order: [baseline-first, candidate-first]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ inputs.diagnostics_baseline }}
                  path: .agents/worktrees/browser-baseline
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.4"
                  no-cache: true
            - run: bun install --frozen-lockfile
            - run: bun install --frozen-lockfile
              working-directory: .agents/worktrees/browser-baseline
            - name: Compare revisions on the same runner
              env:
                  DIAGNOSTIC_SUITE: ${{ matrix.suite }}
                  DIAGNOSTIC_ORDER: ${{ matrix.order }}
                  HERDR_BROWSER_DIAGNOSTICS_MODE: ${{ inputs.diagnostics_mode }}
              run: |
                  export HERDR_DIAGNOSTIC_CHROME="$(command -v google-chrome)"
                  export CHROME_BIN="$GITHUB_WORKSPACE/scripts/browser-diagnostics.ts"
                  export DIAGNOSTIC_ROOT="$RUNNER_TEMP/browser-diagnostics"
                  mkdir -p "$DIAGNOSTIC_ROOT"
                  {
                    "$HERDR_DIAGNOSTIC_CHROME" --version
                    bun --version
                    getconf _NPROCESSORS_ONLN
                    df -h /dev/shm
                    git rev-parse HEAD
                    git -C .agents/worktrees/browser-baseline rev-parse HEAD
                  } > "$DIAGNOSTIC_ROOT/environment.txt"
                  revisions="baseline candidate"
                  if [ "$DIAGNOSTIC_ORDER" = candidate-first ]; then revisions="candidate baseline"; fi
                  result=0
                  for revision in $revisions; do
                    directory="$GITHUB_WORKSPACE"
                    if [ "$revision" = baseline ]; then directory="$directory/.agents/worktrees/browser-baseline"; fi
                    export HERDR_BROWSER_DIAGNOSTICS_DIR="$DIAGNOSTIC_ROOT/$revision"
                    mkdir -p "$HERDR_BROWSER_DIAGNOSTICS_DIR"
                    if (cd "$directory" && bun run test "web/src/world/$DIAGNOSTIC_SUITE.test.ts" --parallel=1 --max-concurrency=1) > "$HERDR_BROWSER_DIAGNOSTICS_DIR/tests.log" 2>&1; then
                      revision_result=0
                    else
                      revision_result=$?
                      result=1
                    fi
                    echo "$revision_result" > "$HERDR_BROWSER_DIAGNOSTICS_DIR/exit-code.txt"
                    tail -25 "$HERDR_BROWSER_DIAGNOSTICS_DIR/tests.log"
                  done
                  exit "$result"
            - name: Retain browser lifecycle evidence
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: browser-lifecycle-${{ matrix.suite }}-${{ matrix.order }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/browser-diagnostics
                  if-no-files-found: warn
                  retention-days: 7

    # Every other PR job needs this one, so a closed or merged PR's edit or label
    # starts no runner: GitHub has no workflow-level condition, only skipped jobs.
    validation-scope:
        name: Validation scope
        if: github.event_name != 'pull_request' || github.event.pull_request.state == 'open'
        runs-on: ubuntu-latest
        outputs:
            mode: ${{ steps.scope.outputs.mode || 'full' }}
            selection: ${{ steps.scope.outputs.selection }}
            world: ${{ steps.scope.outputs.world }}
            verification: ${{ steps.scope.outputs.verification }}
            packaging: ${{ steps.scope.outputs.packaging }}
            installer_tag: ${{ steps.installer-plan.outputs.baseline_tag }}
            installer_sha: ${{ steps.installer-plan.outputs.baseline_sha }}
            installer_version: ${{ steps.installer-plan.outputs.candidate_version }}
            installer_hash: ${{ steps.installer-plan.outputs.build_hash }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.4"
                  no-cache: true
            - name: Check PR description
              if: github.event_name == 'pull_request'
              run: bun run check:pr-body --event "$GITHUB_EVENT_PATH"
            - name: Determine validation scope
              id: scope
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_ACTION: ${{ github.event.action }}
                  WORLD_BROWSER_STABILITY: ${{ contains(github.event.pull_request.labels.*.name, 'world-browser-stability') }}
                  REQUIRED_JOB_NAME: Delivery checks
                  REQUIRED_FULL_STEP: Run full repository check
              run: bun scripts/ci-reuse-full-check.ts
            # A title, description or label change on a head whose latest
            # result is red keeps it red and starts no code job. Re-running
            # this job decides again, so it reuses that result once it passes.
            - name: Hold the head's red result
              if: steps.scope.outputs.mode == 'hold'
              env:
                  HELD_RUN: ${{ steps.scope.outputs.held_run }}
              run: |
                  echo "::error::Run $HELD_RUN is this head's latest result and it is red. A title, description or label change retests nothing: re-run that run's failed jobs, then this run's failed jobs, or push a commit."
                  exit 1
            - name: Freeze latest stable installer baseline
              id: installer-plan
              if: steps.scope.outputs.packaging == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bun scripts/installer-upgrade.ts plan

    # A reused Delivery checks result already required this audit on the same merge.
    dependency-security:
        name: Shipped dependency security
        needs: validation-scope
        if: needs.validation-scope.outputs.mode != 'reuse'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.4"
                  no-cache: true
            - run: bun install --frozen-lockfile --ignore-scripts
            - run: bun run security:check

    static:
        name: Static checks
        needs: validation-scope
        if: needs.validation-scope.outputs.mode != 'reuse'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            HERDR_WORLD_RATCHET_TARGET: ${{ github.event.pull_request.base.sha }}
            HERDR_CI_SELECTION: ${{ needs.validation-scope.outputs.selection }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  # Match the immutable event base even if the PR merge ref advances.
                  ref: ${{ github.sha }}
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.4"
                  no-cache: true
            - run: bun install --frozen-lockfile
            - name: Run documentation checks
              if: needs.validation-scope.outputs.mode == 'docs'
              run: bun run check:docs
            - name: Run static repository checks
              if: needs.validation-scope.outputs.mode != 'docs'
              run: bun run check:static

    unit-tests:
        name: Non-browser tests (${{ matrix.shard }}/2)
        needs: validation-scope
        if: needs.validation-scope.outputs.mode != 'reuse' && needs.validation-scope.outputs.mode != 'docs'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.4"
                  no-cache: true
            - run: bun install --frozen-lockfile
            - name: Build process-test assets on this runner
              run: bun run build
            - name: Run affected non-browser tests
              env:
                  HERDR_CI_SELECTION: ${{ needs.validation-scope.outputs.selection }}
                  HERDR_TEST_PARALLEL: "1"
                  HERDR_TEST_MAX_CONCURRENCY: "2"
                  HERDR_TEST_EXCLUDE_WORLD_BROWSER: "1"
              run: bun scripts/ci-tests.ts unit ${{ matrix.shard }}/2

    validation:
        name: Repository validation
        needs: [validation-scope, static, unit-tests]
        if: always() && needs.validation-scope.result != 'skipped' && needs.validation-scope.outputs.mode != 'reuse' && needs.validation-scope.outputs.mode != 'hold'
        runs-on: ubuntu-latest
        steps:
            - name: Require static checks and applicable unit shards
              env:
                  STATIC_RESULT: ${{ needs.static.result }}
                  UNIT_RESULT: ${{ needs.unit-tests.result }}
                  MODE: ${{ needs.validation-scope.outputs.mode }}
              run: |
                  test "$STATIC_RESULT" = success
                  expected=success
                  if [ "$MODE" = docs ]; then expected=skipped; fi
                  test "$UNIT_RESULT" = "$expected"

    world-browser:
        name: World browser tests
        needs: validation-scope
        if: needs.validation-scope.outputs.world == 'true'
        uses: ./.github/workflows/world-browser.yml
        with:
            selection: ${{ needs.validation-scope.outputs.selection }}
            stability: ${{ contains(github.event.pull_request.labels.*.name, 'world-browser-stability') }}

    behavioral:
        name: Behavioral verification
        needs: validation-scope
        if: needs.validation-scope.outputs.verification == 'true'
        uses: ./.github/workflows/behavioral-verification.yml

    delivery:
        name: Delivery checks
        needs: [validation-scope, validation, world-browser, behavioral, installer-upgrade, launchd, dependency-security]
        env:
            HERDR_CI_SELECTION: ${{ needs.validation-scope.outputs.selection }}
        if: always() && needs.validation-scope.result != 'skipped'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.4"
                  no-cache: true
            - name: Require current dependency security audit
              env:
                  SECURITY_RESULT: ${{ needs.dependency-security.result }}
                  VALIDATION_MODE: ${{ needs.validation-scope.outputs.mode }}
              run: |
                  expected=success
                  if [ "$VALIDATION_MODE" = reuse ] || [ "$VALIDATION_MODE" = hold ]; then expected=skipped; fi
                  test "$SECURITY_RESULT" = "$expected"
            - name: Determine validation scope
              run: echo "Validation mode is $VALIDATION_MODE"
              env:
                  VALIDATION_MODE: ${{ needs.validation-scope.outputs.mode }}
            - name: Run full repository check
              if: needs.validation-scope.outputs.mode == 'full'
              env:
                  VALIDATION_MODE: full
                  SCOPE_RESULT: ${{ needs.validation-scope.result }}
                  VALIDATION_RESULT: ${{ needs.validation.result }}
                  WORLD_RESULT: ${{ needs.world-browser.result }}
                  BEHAVIORAL_RESULT: ${{ needs.behavioral.result }}
                  INSTALLER_RESULT: ${{ needs.installer-upgrade.result }}
                  LAUNCHD_RESULT: ${{ needs.launchd.result }}
              run: bun scripts/ci-delivery-result.ts
            - name: Verify applicable or reused results
              if: needs.validation-scope.outputs.mode != 'full'
              env:
                  VALIDATION_MODE: ${{ needs.validation-scope.outputs.mode }}
                  SCOPE_RESULT: ${{ needs.validation-scope.result }}
                  VALIDATION_RESULT: ${{ needs.validation.result }}
                  WORLD_RESULT: ${{ needs.world-browser.result }}
                  BEHAVIORAL_RESULT: ${{ needs.behavioral.result }}
                  INSTALLER_RESULT: ${{ needs.installer-upgrade.result }}
                  LAUNCHD_RESULT: ${{ needs.launchd.result }}
              run: bun scripts/ci-delivery-result.ts

    # Native inputs select packaging; main still runs the complete matrix.
    installer-upgrade:
        needs: validation-scope
        if: needs.validation-scope.outputs.packaging == 'true'
        uses: ./.github/workflows/installer-upgrade.yml
        with:
            baseline_tag: ${{ needs.validation-scope.outputs.installer_tag }}
            baseline_sha: ${{ needs.validation-scope.outputs.installer_sha }}
            candidate_version: ${{ needs.validation-scope.outputs.installer_version }}
            build_hash: ${{ needs.validation-scope.outputs.installer_hash }}

    launchd:
        name: macOS launchd plugin lifecycle (${{ matrix.arch }})
        needs: [validation-scope, installer-upgrade]
        if: always() && needs.validation-scope.result != 'skipped'
        # Keep the two protected names. Native work shares each Darwin installer
        # runner, so the installer cannot queue behind our own launchd job.
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                arch: [arm64, x86_64]
        steps:
            - name: Require the applicable native lifecycle results
              env:
                  SCOPE_RESULT: ${{ needs.validation-scope.result }}
                  PACKAGING: ${{ needs.validation-scope.outputs.packaging }}
                  INSTALLER_RESULT: ${{ needs.installer-upgrade.result }}
              run: |
                  test "$SCOPE_RESULT" = success
                  expected=skipped
                  if [ "$PACKAGING" = true ]; then expected=success; fi
                  test "$INSTALLER_RESULT" = "$expected"

    # A title or description edit rebuilds no preview; a new commit, a new base
    # or adding a label still does.
    release-preview:
        name: Downloadable preview (${{ matrix.platform }})
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-preview') && (github.event.action != 'edited' || github.event.changes.base)
        needs: delivery
        # Keep in step with Release's package job so previews predict its checks.
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                platform:
                    - linux-x64
                    - linux-arm64
                    - darwin-x64
                    - darwin-arm64
                    - windows-x64
                    - windows-arm64
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.4"
                  no-cache: true
            - run: bun install --frozen-lockfile
            - name: Build branch preview archive
              shell: bash
              run: |
                  HERDR_WORLD_BUILD_VERSION="0.0.0-rc.$GITHUB_RUN_NUMBER" bun run package:${{ matrix.platform }}
            - name: Verify branch preview archive
              shell: bash
              run: scripts/verify-release-package.sh "0.0.0-rc.$GITHUB_RUN_NUMBER" "${{ matrix.platform }}"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: preview-${{ matrix.platform }}
                  path: dist/herdr-world-v0.0.0-rc.${{ github.run_number }}-${{ matrix.platform }}.tar.xz*
                  if-no-files-found: error
                  retention-days: 14

    npm-preview:
        name: Downloadable npm preview
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-preview') && (github.event.action != 'edited' || github.event.changes.base)
        needs: [delivery, release-preview]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.4"
                  no-cache: true
            - run: bun install --frozen-lockfile
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24"
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  path: dist
                  pattern: preview-*-*
                  merge-multiple: true
            - name: Stage and smoke npm packages from preview archives
              shell: bash
              run: |
                  set -euo pipefail
                  version="0.0.0-rc.$GITHUB_RUN_NUMBER"
                  bun scripts/stage-npm-release.ts "$version"
                  mkdir -p dist/npm-tarballs
                  for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
                    npm pack "dist/npm/$platform" --pack-destination dist/npm-tarballs --silent
                  done
                  npm pack dist/npm/launcher --pack-destination dist/npm-tarballs --silent
                  npm install --ignore-scripts --offline --prefix dist/npm-smoke \
                    "./dist/npm-tarballs/ivoryheart-herdr-world-linux-x64-$version.tgz" \
                    "./dist/npm-tarballs/ivoryheart-herdr-world-$version.tgz"
                  test "$(dist/npm-smoke/node_modules/.bin/herdr-world --version)" = "herdr-world $version"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: preview-npm
                  path: dist/npm-tarballs/*.tgz
                  if-no-files-found: error
                  retention-days: 14

    homebrew-preview:
        name: Downloadable Homebrew preview
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-preview') && (github.event.action != 'edited' || github.event.changes.base)
        needs: [delivery, release-preview]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  path: dist
                  pattern: preview-darwin-*
                  merge-multiple: true
            - name: Prepare and check the local Homebrew Formula
              shell: bash
              run: |
                  set -euo pipefail
                  cp scripts/install-homebrew-preview.sh dist/
                  for platform in darwin-arm64 darwin-x64; do
                    HERDR_WORLD_PREVIEW_PLATFORM="$platform" bash dist/install-homebrew-preview.sh --prepare-only
                    ruby -c dist/herdr-world-preview.rb
                    archive="$(find dist -maxdepth 1 -name "herdr-world-v*-$platform.tar.xz" -print -quit)"
                    ruby scripts/check-homebrew-formula-stage.rb dist/herdr-world-preview.rb "$archive" HerdrWorldPreview
                  done
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: preview-homebrew
                  path: |
                      dist/herdr-world-v*.tar.xz
                      dist/herdr-world-v*.tar.xz.sha256
                      dist/install-homebrew-preview.sh
                  if-no-files-found: error
                  retention-days: 14
