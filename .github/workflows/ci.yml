name: CI

on:
    pull_request:
    # Prepare Release uses this explicit dispatch because events created with its
    # GITHUB_TOKEN do not start other workflows automatically.
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    delivery:
        name: Delivery checks
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.1"
                  no-cache: true
            - run: bun install --frozen-lockfile
            - run: bun run check

    launchd:
        name: macOS launchd plugin lifecycle (${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: arm64
                      runner: macos-15
                    - arch: x86_64
                      runner: macos-15-intel
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.1"
                  no-cache: true
            - run: bun install --frozen-lockfile
            - name: Build the native World service
              run: bun run build
            - name: Exercise the real plugin-managed launchd lifecycle
              shell: bash
              run: |
                  set -euo pipefail

                  cleanup() {
                    bun scripts/world-plugin.ts uninstall >/dev/null 2>&1 || true
                  }
                  wait_until_ready() {
                    for _ in {1..80}; do
                      if curl --fail --silent --show-error \
                        http://127.0.0.1:8787/healthz >/dev/null; then
                        return 0
                      fi
                      sleep 0.25
                    done
                    echo "Herdr World did not become ready" >&2
                    tail -n 100 "$HOME/Library/Logs/herdr-world.stderr.log" >&2 || true
                    return 1
                  }

                  trap cleanup EXIT
                  cleanup
                  bun scripts/world-plugin.ts start
                  wait_until_ready
                  bun scripts/world-plugin.ts status
                  bun scripts/world-plugin.ts restart
                  wait_until_ready
                  bun scripts/world-plugin.ts status
                  bun scripts/world-plugin.ts uninstall
                  test ! -e "$HOME/Library/LaunchAgents/dev.herdr-world.plist"
                  trap - EXIT
