name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent:
    name: Agent harness
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm ci --prefix harness
      - run: npm run test:agent
      - run: npm run spec:check
      - run: npm run eval:check
      - name: Select environment checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const base = process.env.BASE_SHA;
          const files = /^[a-f0-9]{40}$/.test(base ?? '') && !/^0+$/.test(base)
            ? execFileSync('git', ['diff', '--name-only', base, 'HEAD'], {encoding:'utf8'}).split('\n')
            : ['harness/'];
          const needed = files.some(file => /^(harness\/|scripts\/agent\/|evals\/|\.agents\/|AGENTS\.md$|\.github\/workflows\/ci\.yml$)/.test(file));
          appendFileSync(process.env.GITHUB_OUTPUT, 'environment=' + needed + '\n');
          JS
      - name: Build isolated execution image
        if: steps.scope.outputs.environment == 'true'
        run: npm run agent:image
      - name: Exercise the production supervisor without model calls
        if: steps.scope.outputs.environment == 'true'
        run: node --test scripts/agent/container.test.mjs
      - uses: astral-sh/setup-uv@v6
        if: steps.scope.outputs.environment == 'true'
        with:
          version: "0.12.1"
      - name: Validate held-out Harbor graders
        if: steps.scope.outputs.environment == 'true'
        run: |
          uv sync --project evals --locked
          task_path=$(node evals/prepare.mjs)
          npm run eval:harbor -- run -p "$task_path" -a oracle -n 1 --jobs-dir evals/jobs --job-name oracle
          node evals/assert-result.mjs evals/jobs/oracle 1
          npm run eval:harbor -- run -p "$task_path" -a nop -n 1 --jobs-dir evals/jobs --job-name negative
          node evals/assert-result.mjs evals/jobs/negative 0
      - name: Upload harness diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: agent-harness-diagnostics
          path: evals/jobs
          if-no-files-found: ignore

  delivery:
    name: Delivery checks
    if: always()
    needs: [launchd, check, browser, agent]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); if (!Object.values(jobs).every(job => job.result === "success")) process.exit(1)'

  launchd:
    name: macOS launchd plugin lifecycle (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Exercise the real launchd plugin lifecycle
        env:
          HERDR_WORLD_REAL_LAUNCHD: "1"
        run: node --test scripts/herdr-world-plugin.test.mjs

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Install repository check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Install root dependencies
        run: npm ci
      - name: Install pinned harness dependencies
        run: npm ci --prefix harness
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Run complete non-live checks
        run: npm run check
      - name: Run independence audit
        run: npm run test:independence
      - uses: taiki-e/install-action@cargo-audit
      - name: Run dependency and secret security checks
        run: npm run test:security

  browser:
    name: Browser shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run test-level browser shard
        run: >-
          npm run test:e2e --
          --fully-parallel
          --workers=1
          --shard=${{ matrix.shard }}/4
          --fail-on-flaky-tests
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: .scratch/playwright
          if-no-files-found: ignore
