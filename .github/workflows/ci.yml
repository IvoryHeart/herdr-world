name: CI

on:
    pull_request:
        types: [opened, synchronize, reopened, edited, labeled]
    # Prepare Release uses this explicit dispatch because events created with its
    # GITHUB_TOKEN do not start other workflows automatically.
    workflow_dispatch:
        inputs:
            browser_diagnostics:
                description: Compare browser lifecycle on the baseline and dispatched revision
                type: boolean
                default: false
            diagnostics_baseline:
                description: Baseline Git ref or commit for the browser comparison
                type: string
                default: main
            diagnostics_mode:
                description: Capture lifecycle events or only Chrome stderr
                type: choice
                options: [lifecycle, stderr]
                default: lifecycle

permissions:
    contents: read
    actions: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
    browser-diagnostics:
        name: Browser lifecycle (${{ matrix.suite }}, ${{ matrix.order }})
        if: github.event_name == 'workflow_dispatch' && inputs.browser_diagnostics
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            max-parallel: 3
            matrix:
                suite: [HostsFilter.creation, SpatialGraphView.browser, useSpacesTabWindowArrangement.browser]
                order: [baseline-first, candidate-first]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ inputs.diagnostics_baseline }}
                  path: .agents/worktrees/browser-baseline
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.3"
                  no-cache: true
            - run: bun install --frozen-lockfile
            - run: bun install --frozen-lockfile
              working-directory: .agents/worktrees/browser-baseline
            - name: Compare revisions on the same runner
              env:
                  DIAGNOSTIC_SUITE: ${{ matrix.suite }}
                  DIAGNOSTIC_ORDER: ${{ matrix.order }}
                  HERDR_BROWSER_DIAGNOSTICS_MODE: ${{ inputs.diagnostics_mode }}
              run: |
                  export HERDR_DIAGNOSTIC_CHROME="$(command -v google-chrome)"
                  export CHROME_BIN="$GITHUB_WORKSPACE/scripts/browser-diagnostics.ts"
                  export DIAGNOSTIC_ROOT="$RUNNER_TEMP/browser-diagnostics"
                  mkdir -p "$DIAGNOSTIC_ROOT"
                  {
                    "$HERDR_DIAGNOSTIC_CHROME" --version
                    bun --version
                    getconf _NPROCESSORS_ONLN
                    df -h /dev/shm
                    git rev-parse HEAD
                    git -C .agents/worktrees/browser-baseline rev-parse HEAD
                  } > "$DIAGNOSTIC_ROOT/environment.txt"
                  revisions="baseline candidate"
                  if [ "$DIAGNOSTIC_ORDER" = candidate-first ]; then revisions="candidate baseline"; fi
                  result=0
                  for revision in $revisions; do
                    directory="$GITHUB_WORKSPACE"
                    if [ "$revision" = baseline ]; then directory="$directory/.agents/worktrees/browser-baseline"; fi
                    export HERDR_BROWSER_DIAGNOSTICS_DIR="$DIAGNOSTIC_ROOT/$revision"
                    mkdir -p "$HERDR_BROWSER_DIAGNOSTICS_DIR"
                    if (cd "$directory" && bun run test "web/src/world/$DIAGNOSTIC_SUITE.test.ts" --parallel=1 --max-concurrency=1) > "$HERDR_BROWSER_DIAGNOSTICS_DIR/tests.log" 2>&1; then
                      revision_result=0
                    else
                      revision_result=$?
                      result=1
                    fi
                    echo "$revision_result" > "$HERDR_BROWSER_DIAGNOSTICS_DIR/exit-code.txt"
                    tail -25 "$HERDR_BROWSER_DIAGNOSTICS_DIR/tests.log"
                  done
                  exit "$result"
            - name: Retain browser lifecycle evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: browser-lifecycle-${{ matrix.suite }}-${{ matrix.order }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/browser-diagnostics
                  if-no-files-found: warn
                  retention-days: 7

    validation-scope:
        name: Validation scope
        runs-on: ubuntu-latest
        outputs:
            mode: ${{ steps.scope.outputs.mode || 'full' }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.3"
                  no-cache: true
            - name: Check knowledge-map impact
              if: github.event_name == 'pull_request'
              run: bun scripts/check-knowledge-map.ts "$GITHUB_EVENT_PATH"
            - name: Determine validation scope
              if: github.event_name == 'pull_request'
              id: scope
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_ACTION: ${{ github.event.action }}
                  REQUIRED_JOB_NAME: Delivery checks
                  REQUIRED_FULL_STEP: Run full repository check
              run: bun scripts/ci-reuse-full-check.ts

    validation:
        name: Repository validation
        needs: validation-scope
        if: needs.validation-scope.outputs.mode != 'reuse'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.3"
                  no-cache: true
            - run: bun install --frozen-lockfile
            - name: Run documentation checks
              if: needs.validation-scope.outputs.mode == 'docs'
              run: bun run check:docs
            - name: Run repository checks except World browser shards
              if: needs.validation-scope.outputs.mode == 'full'
              env:
                  HERDR_TEST_PARALLEL: "1"
                  HERDR_TEST_MAX_CONCURRENCY: "2"
                  HERDR_TEST_EXCLUDE_WORLD_BROWSER: "1"
              run: bun run check

    world-browser:
        name: World browser tests
        needs: validation-scope
        if: needs.validation-scope.outputs.mode == 'full'
        uses: ./.github/workflows/world-browser.yml

    delivery:
        name: Delivery checks
        needs: [validation-scope, validation, world-browser]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.3"
                  no-cache: true
            - name: Determine validation scope
              run: echo "Validation mode is $VALIDATION_MODE"
              env:
                  VALIDATION_MODE: ${{ needs.validation-scope.outputs.mode }}
            - name: Run full repository check
              if: needs.validation-scope.outputs.mode == 'full'
              env:
                  VALIDATION_MODE: full
                  SCOPE_RESULT: ${{ needs.validation-scope.result }}
                  VALIDATION_RESULT: ${{ needs.validation.result }}
                  WORLD_RESULT: ${{ needs.world-browser.result }}
              run: bun scripts/ci-delivery-result.ts
            - name: Verify documentation or reused results
              if: needs.validation-scope.outputs.mode != 'full'
              env:
                  VALIDATION_MODE: ${{ needs.validation-scope.outputs.mode }}
                  SCOPE_RESULT: ${{ needs.validation-scope.result }}
                  VALIDATION_RESULT: ${{ needs.validation.result }}
                  WORLD_RESULT: ${{ needs.world-browser.result }}
              run: bun scripts/ci-delivery-result.ts

    launchd:
        name: macOS launchd plugin lifecycle (${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: arm64
                      runner: macos-15
                    - arch: x86_64
                      runner: macos-15-intel
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.3"
                  no-cache: true
            - name: Determine validation scope
              if: github.event_name == 'pull_request'
              id: scope
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_ACTION: ${{ github.event.action }}
                  REQUIRED_JOB_NAME: macOS launchd plugin lifecycle (${{ matrix.arch }})
                  REQUIRED_FULL_STEP: Exercise the real plugin-managed launchd lifecycle
              run: bun scripts/ci-reuse-full-check.ts
            - run: bun install --frozen-lockfile
              if: steps.scope.outputs.mode != 'docs' && steps.scope.outputs.mode != 'reuse'
            - name: Build the native World service
              if: steps.scope.outputs.mode != 'docs' && steps.scope.outputs.mode != 'reuse'
              run: bun run build
            - name: Compile the standalone plugin launcher
              if: steps.scope.outputs.mode != 'docs' && steps.scope.outputs.mode != 'reuse'
              run: bun scripts/world-plugin.ts compile-launcher
            - name: Exercise the real plugin-managed launchd lifecycle
              if: steps.scope.outputs.mode != 'docs' && steps.scope.outputs.mode != 'reuse'
              shell: bash
              run: |
                  set -euo pipefail
                  plugin_launcher="$PWD/server/herdr-world-plugin.exe"

                  cleanup() {
                    PATH=/usr/bin:/bin "$plugin_launcher" uninstall >/dev/null 2>&1 || true
                  }
                  wait_until_ready() {
                    for _ in {1..80}; do
                      if curl --fail --silent --show-error \
                        http://127.0.0.1:8787/healthz >/dev/null; then
                        return 0
                      fi
                      sleep 0.25
                    done
                    echo "Herdr World did not become ready" >&2
                    tail -n 100 "$HOME/Library/Logs/herdr-world.stderr.log" >&2 || true
                    return 1
                  }

                  trap cleanup EXIT
                  cleanup
                  PATH=/usr/bin:/bin "$plugin_launcher" start
                  wait_until_ready
                  PATH=/usr/bin:/bin "$plugin_launcher" status
                  PATH=/usr/bin:/bin "$plugin_launcher" restart
                  wait_until_ready
                  PATH=/usr/bin:/bin "$plugin_launcher" status
                  PATH=/usr/bin:/bin "$plugin_launcher" uninstall
                  test ! -e "$HOME/Library/LaunchAgents/dev.herdr-world.plist"
                  trap - EXIT

    release-preview:
        name: Downloadable preview (${{ matrix.platform }})
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-preview')
        needs: delivery
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                platform:
                    - linux-x64
                    - linux-arm64
                    - darwin-x64
                    - darwin-arm64
                    - windows-x64
                    - windows-arm64
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.3"
                  no-cache: true
            - run: bun install --frozen-lockfile
            - name: Build branch preview archive
              shell: bash
              run: |
                  HERDR_WORLD_BUILD_VERSION="0.0.0-rc.$GITHUB_RUN_NUMBER" bun run package:${{ matrix.platform }}
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: preview-${{ matrix.platform }}
                  path: dist/herdr-world-v0.0.0-rc.${{ github.run_number }}-${{ matrix.platform }}.tar.xz*
                  if-no-files-found: error
                  retention-days: 14

    npm-preview:
        name: Downloadable npm preview
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-preview')
        needs: [delivery, release-preview]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.3"
                  no-cache: true
            - run: bun install --frozen-lockfile
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  path: dist
                  pattern: preview-*-*
                  merge-multiple: true
            - name: Stage and smoke npm packages from preview archives
              shell: bash
              run: |
                  set -euo pipefail
                  version="0.0.0-rc.$GITHUB_RUN_NUMBER"
                  bun scripts/stage-npm-release.ts "$version"
                  mkdir -p dist/npm-tarballs
                  for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
                    npm pack "dist/npm/$platform" --pack-destination dist/npm-tarballs --silent
                  done
                  npm pack dist/npm/launcher --pack-destination dist/npm-tarballs --silent
                  npm install --ignore-scripts --offline --prefix dist/npm-smoke \
                    "./dist/npm-tarballs/ivoryheart-herdr-world-linux-x64-$version.tgz" \
                    "./dist/npm-tarballs/ivoryheart-herdr-world-$version.tgz"
                  test "$(dist/npm-smoke/node_modules/.bin/herdr-world --version)" = "herdr-world $version"
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: preview-npm
                  path: dist/npm-tarballs/*.tgz
                  if-no-files-found: error
                  retention-days: 14

    homebrew-preview:
        name: Downloadable Homebrew preview
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-preview')
        needs: [delivery, release-preview]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  path: dist
                  pattern: preview-darwin-*
                  merge-multiple: true
            - name: Prepare and check the local Homebrew Formula
              shell: bash
              run: |
                  set -euo pipefail
                  cp scripts/install-homebrew-preview.sh dist/
                  for platform in darwin-arm64 darwin-x64; do
                    HERDR_WORLD_PREVIEW_PLATFORM="$platform" bash dist/install-homebrew-preview.sh --prepare-only
                    ruby -c dist/herdr-world-preview.rb
                    archive="$(find dist -maxdepth 1 -name "herdr-world-v*-$platform.tar.xz" -print -quit)"
                    ruby scripts/check-homebrew-formula-stage.rb dist/herdr-world-preview.rb "$archive" HerdrWorldPreview
                  done
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: preview-homebrew
                  path: |
                      dist/herdr-world-v*.tar.xz
                      dist/herdr-world-v*.tar.xz.sha256
                      dist/install-homebrew-preview.sh
                  if-no-files-found: error
                  retention-days: 14
