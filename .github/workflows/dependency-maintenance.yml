name: Maintain dependency PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dependency-maintenance-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only base policy is executable. The dependency candidate is data, with
      # lifecycle scripts disabled and no write token available in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
          no-cache: true
      - name: Regenerate dependency notices and changelog metadata
        run: bun policy/scripts/dependency-maintenance.ts prepare "$GITHUB_EVENT_PATH" candidate "$RUNNER_TEMP/dependency-maintenance.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-maintenance
          path: ${{ runner.temp }}/dependency-maintenance.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
          no-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dependency-maintenance
          path: ${{ runner.temp }}
      - name: Commit generated docs, update body and dispatch checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/dependency-maintenance.ts publish "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/dependency-maintenance.json"
