name: Behavioral verification

# Accepted bounded contracts; protected Delivery checks depend on this workflow.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERIFICATION_JAVA_VERSION: "21.0.13+9"

concurrency:
  group: behavioral-verification-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  shards:
    name: Behavioral models (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      # Every model partition within the full run's sixteen-job cap.
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - name: Install pinned verification Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.VERIFICATION_JAVA_VERSION }}
          architecture: x64
      - name: Hash model, adapter, replay, tooling and seed inputs
        id: content
        run: bun scripts/ci-model-groups.ts key ${{ matrix.shard }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'pull_request'
        with:
          path: .agents/model-cache
          key: model-group-v1-${{ matrix.shard }}-${{ steps.content.outputs.hash }}
          restore-keys: model-group-v1-${{ matrix.shard }}-
      - name: Validate reusable model evidence
        id: reuse
        if: github.event_name == 'pull_request'
        run: bun scripts/ci-model-groups.ts restore ${{ matrix.shard }}
      # Current-tree tooling checks always run, including complete cache hits.
      - run: bun install --frozen-lockfile
        if: matrix.shard == 1 || steps.reuse.outputs.reused != 'true'
      - name: Install locked development tooling
        if: matrix.shard == 1
        run: npm ci --prefix tools/quint --ignore-scripts --no-audit --no-fund
      - name: Validate maintained types and tooling notices
        if: matrix.shard == 1
        run: |
          bun run verification:typecheck
          bun run verification:notices:check
      - if: steps.reuse.outputs.reused != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/herdr-world/verification/checker
          key: verification-checker-${{ runner.os }}-${{ hashFiles('tools/quint/checker.json') }}
      - name: Install locked development tooling and verified checker
        if: steps.reuse.outputs.reused != 'true'
        run: bun run verification:setup
      - name: Run all accepted models within enforced resource limits
        if: steps.reuse.outputs.reused != 'true'
        run: bun scripts/ci-model-groups.ts run ${{ matrix.shard }}
      # Once per run: only the group owning browser-refresh, when it misses.
      - name: Exercise a failing candidate and verify retained diagnostics
        if: steps.reuse.outputs.reused != 'true'
        run: bun scripts/ci-model-groups.ts control ${{ matrix.shard }}
      - name: Prepare passing model evidence for reuse
        if: steps.reuse.outputs.reused != 'true'
        run: bun scripts/ci-model-groups.ts save ${{ matrix.shard }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: .agents/model-cache
          key: model-group-v1-${{ matrix.shard }}-${{ steps.content.outputs.hash }}
      - name: Retain source-bound evidence manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: behavioral-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            .agents/verification/runs/**/manifest.json
            .agents/verification/runs/**/origin.json
            .agents/verification/retries/**
            .agents/verification/diagnostics/**
            .agents/verification/resources/**/resources.json
          include-hidden-files: true
          # Setup failures have no manifest yet. Keep the primary error; the
          # aggregate still rejects missing or incomplete evidence.
          if-no-files-found: warn
          retention-days: 14

  # Direct manual runs still publish canonical evidence. PR/CI calls aggregate
  # in Delivery checks, so their model leaves have no intermediate runner.
  candidate:
    name: Behavioral verification
    if: github.event_name == 'workflow_dispatch' && github.workflow == 'Behavioral verification'
    needs: shards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: behavioral-shard-*
          path: .agents/verification
          merge-multiple: true
      - name: Require complete source-bound models and every enforced shard limit
        run: bun scripts/ci-verification.ts aggregate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: behavioral-evidence-${{ github.run_attempt }}
          path: .agents/verification/runs/ci-aggregate-*/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
