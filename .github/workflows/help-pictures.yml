name: Refresh Help pictures

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

# One writer and one PR. A pending run uses the newest main after the writer exits.
concurrency:
  group: help-pictures
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Check freshness
        id: freshness
        run: |
          if bun run help:check --strict; then
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Regenerate Help
        if: steps.freshness.outputs.refresh == 'true'
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          bun run help:pictures
          bun run help:docs
          bun run help:check --strict
      - name: Publish bot PR
        if: steps.freshness.outputs.refresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=bot/help-pictures
          git checkout -B "$branch"
          git add -A web/public/help/ web/src/help/pictures.json docs/HELP.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh Help pictures from main"
          bun run check:privacy
          body="$RUNNER_TEMP/help-pictures-pr.md"
          cat > "$body" <<'BODY'
          Refresh Help pictures and their input fingerprints from the production components on main; regenerate docs/HELP.md from the declarations.

          Try: Open **What can I do here?** beside the views and inspect a Town entry's picture in light and dark themes.

          Changelog: none — generated Help assets refresh existing guidance.
          Spec impact: none — generated assets leave product contracts unchanged.
          Verification impact: none — generated assets change no ordering, authority or recovery behavior.
          BODY
          bun run check:pr-body "$body"
          gh auth setup-git
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          gh label create help-pictures --color 0075CA --description "Generated Help picture refresh" --force
          gh label create auto-merge --color 0E8A16 --description "Owner rule may merge after required checks pass" --force
          pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$body" --add-label help-pictures,auto-merge,skip-changelog
          else
            gh pr create --head "$branch" --base main --title "docs: refresh Help pictures" \
              --body-file "$body" --label help-pictures --label auto-merge --label skip-changelog
          fi
          # GITHUB_TOKEN events do not trigger workflows; run exact-head gates explicitly.
          gh workflow run ci.yml --ref "$branch"
          gh workflow run privacy.yml --ref "$branch"
