name: Release

on:
  # Dispatches on main/PR branches rehearse every channel without publishing.
  # Publication on a tag requires authorization retained before that tag existed.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify every channel and generate the tap PR without publishing
        type: boolean
        default: true
      version:
        description: Candidate version for a dry run (defaults to plugin version)
        type: string
        required: false
      publish_run_id:
        description: Publish Release run that authorized this tag before its creation (required for publication)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-publication
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    outputs:
      selection: ${{ steps.scope.outputs.selection }}
      walk_run_id: ${{ steps.walk.outputs.walk_run_id }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      dry_run: ${{ steps.metadata.outputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Refuse fixable high or critical shipped vulnerabilities
        run: bun run security:check
      - name: Select the complete release suite inventory
        id: scope
        run: bun scripts/ci-reuse-full-check.ts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Verify release metadata
        id: metadata
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION_INPUT: ${{ inputs.version }}
        run: bun scripts/release-plan.ts
      - name: Require pre-tag release walk authorization
        id: walk
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
          DRY_RUN: ${{ steps.metadata.outputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            echo "Channel rehearsal only; publication still requires the pre-tag release walk."
          else
            bun scripts/release-walk-gate.ts publication "$GITHUB_SHA" "${GITHUB_REF_NAME#v}" "$PUBLISH_RUN_ID"
          fi
      - name: Verify npm package bootstrap before publication
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
            npm view "@ivoryheart/herdr-world-$platform@0.0.0-seed.0" version --json >/dev/null || {
              echo "Bootstrap @ivoryheart/herdr-world-$platform and configure its trusted publisher before release" >&2
              exit 1
            }
          done
      - name: Validate repository except World browser shards
        env:
          HERDR_TEST_PARALLEL: "1"
          HERDR_TEST_MAX_CONCURRENCY: "2"
          HERDR_TEST_EXCLUDE_WORLD_BROWSER: "1"
        run: bun run check:source

  world-browser:
    name: World browser tests
    needs: validate
    uses: ./.github/workflows/world-browser.yml
    with:
      selection: ${{ needs.validate.outputs.selection }}

  package:
    name: Package ${{ matrix.platform }}
    needs: [validate, world-browser]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
          - windows-x64
          - windows-arm64
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    # Keep in step with CI's release-preview job, which verifies the same packages.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Download the exact Unix package that passed the pre-tag walk
        if: needs.validate.outputs.dry_run == 'false' && !startsWith(matrix.platform, 'windows-')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate.outputs.walk_run_id }}
          name: release-walk-package-${{ matrix.platform }}
          path: dist
      - name: Build release package
        if: startsWith(matrix.platform, 'windows-')
        shell: bash
        run: |
          version="$RELEASE_VERSION"
          HERDR_WORLD_BUILD_VERSION="$version" bun run package:${{ matrix.platform }}
      - name: Build Unix channel rehearsal package
        if: needs.validate.outputs.dry_run == 'true' && !startsWith(matrix.platform, 'windows-')
        shell: bash
        run: |
          version="$RELEASE_VERSION"
          HERDR_WORLD_BUILD_VERSION="$version" bun run package:${{ matrix.platform }}
      - name: Verify release package
        shell: bash
        run: scripts/verify-release-package.sh "$RELEASE_VERSION" "${{ matrix.platform }}"
      - name: Verify real Linux installations and reboot before publication
        if: matrix.platform == 'linux-x64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run test:install-linux --reuse --version "$RELEASE_VERSION" --require-docker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: herdr-world-${{ matrix.platform }}
          path: |
            dist/herdr-world-*.tar.xz*
            dist/herdr-world-*.update.json
          if-no-files-found: error
          retention-days: 30

  archives:
    name: Verify complete archive set
    needs: [validate, package]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: herdr-world-*
          merge-multiple: true
      - name: Verify all archives, aliases, checksums, update feeds and installer
        run: |
          node scripts/check-release-assets.mjs "$RELEASE_VERSION"
          cp scripts/install-herdr-world.sh dist/
          node scripts/check-release-assets.mjs "$RELEASE_VERSION" dist --published
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-archives
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  npm-stage:
    name: Verify npm tarballs
    needs: [validate, archives]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-archives
          path: dist
      - name: Stage and pack the verified binaries
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          bun scripts/stage-npm-release.ts "$version"
          mkdir -p dist/npm-tarballs
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
            npm pack "dist/npm/$platform" --pack-destination dist/npm-tarballs --silent
          done
          npm pack dist/npm/launcher --pack-destination dist/npm-tarballs --silent
          test "$(find dist/npm-tarballs -name '*.tgz' | wc -l)" -eq 7
          npm install --ignore-scripts --offline --prefix dist/npm-smoke \
            "./dist/npm-tarballs/ivoryheart-herdr-world-linux-x64-$version.tgz" \
            "./dist/npm-tarballs/ivoryheart-herdr-world-$version.tgz"
          test "$(dist/npm-smoke/node_modules/.bin/herdr-world --version)" = "herdr-world $version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-packages
          path: dist/npm-tarballs/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  homebrew-formula:
    name: Verify Homebrew Formula and tap PR input
    needs: [validate, archives]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-archives
          path: dist
      - name: Generate and stage-check Formula for the release channel
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          formula="herdr-world.rb"
          formula_class="HerdrWorld"
          if [[ "$version" == *-rc.* ]]; then
            formula="herdr-world-rc.rb"
            formula_class="HerdrWorldRc"
          fi
          bun scripts/generate-homebrew-formula.ts "$version" dist "dist/$formula"
          ruby -c "dist/$formula"
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            ruby scripts/check-homebrew-formula-stage.rb "dist/$formula" \
              "dist/herdr-world-v$version-$platform.tar.xz" "$formula_class"
          done
      - name: Generate tap change and pull request without pushing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          formula="herdr-world.rb"
          if [[ "$RELEASE_VERSION" == *-rc.* ]]; then formula="herdr-world-rc.rb"; fi
          bash scripts/open-homebrew-pr.sh "$RELEASE_VERSION" "dist/$formula" --dry-run "$PWD/tap"
          bun -e 'const workflow = Bun.YAML.parse(await Bun.file("tap/.github/workflows/herdr-world.yml").text()); if (!workflow.jobs.ownership) throw new Error("Missing tap acceptance job");'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: homebrew-formula
          path: tap/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  homebrew-smoke:
    name: Homebrew install (${{ matrix.runner }})
    needs: [validate, archives, homebrew-formula]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: homebrew-formula
          path: tap
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-archives
          path: dist
      - name: Install the candidate archive through Homebrew before publication
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          formula="herdr-world.rb"
          package="herdr-world"
          if [[ "$version" == *-rc.* ]]; then
            formula="herdr-world-rc.rb"
            package="herdr-world-rc"
          fi
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew update
          tap="herdrworld/release-smoke"
          brew tap-new --no-git "$tap"
          # Only transport differs before the public tag exists. Keep the original
          # Formula and PR input intact; Homebrew checks the same archive digests.
          ruby -e 'text = File.read(ARGV[0]); prefix = "https://github.com/IvoryHeart/herdr-world/releases/download/v#{ARGV[2]}/"; File.write(ARGV[1], text.gsub(prefix, "file://#{Dir.pwd}/dist/"))' \
            "tap/Formula/$formula" "$(brew --repository "$tap")/Formula/$formula" "$version"
          brew install --formula "$tap/$package"
          test -z "$(brew deps "$tap/$package")"
          test ! -e "$(brew --prefix "$tap/$package")/bin/herdr"
          test "$("$(brew --prefix "$tap/$package")/bin/herdr-world" --version)" = "herdr-world $version"
          brew test "$tap/$package"
          world="$(brew --prefix "$tap/$package")/bin/herdr-world"
          fixture_home="$(mktemp -d /tmp/hw.XXXXXX)"
          trap 'rm -rf "$fixture_home"' EXIT
          ruby tap/.github/scripts/check-homebrew-runtime.rb "$world" "$fixture_home"
          brew reinstall --formula "$tap/$package"
          ruby tap/.github/scripts/check-homebrew-runtime.rb "$world" "$fixture_home"

  verify:
    name: Seal every verified channel
    needs: [validate, archives, npm-stage, homebrew-formula, homebrew-smoke]
    runs-on: ubuntu-latest
    outputs:
      bundle_digest: ${{ steps.bundle.outputs.artifact-digest }}
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-archives
          path: candidate/github
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-packages
          path: candidate/npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: homebrew-formula
          path: candidate/tap
      - name: Seal immutable publication input
        env:
          DRY_RUN: ${{ needs.validate.outputs.dry_run }}
        run: |
          if test -f "docs/releases/v$RELEASE_VERSION.md"; then
            cp "docs/releases/v$RELEASE_VERSION.md" candidate/notes.md
          elif test "$DRY_RUN" = true; then
            printf 'Dry-run candidate v%s; no publication.\n' "$RELEASE_VERSION" > candidate/notes.md
          else
            exit 1
          fi
          node scripts/release-bundle.mjs seal candidate "$RELEASE_VERSION" "$GITHUB_SHA"
          node scripts/release-bundle.mjs verify candidate "$RELEASE_VERSION" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: bundle
        with:
          name: verified-release
          path: candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [validate, package, archives, npm-stage, homebrew-formula, homebrew-smoke, verify]
    if: needs.validate.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release
          path: candidate
      - name: Check verified digests at publish time
        run: node scripts/release-bundle.mjs verify candidate "$RELEASE_VERSION" "$GITHUB_SHA"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-github-release.mjs "$RELEASE_VERSION" candidate "$GITHUB_SHA"

  npm-publish:
    name: Publish npm packages
    needs: [validate, package, archives, npm-stage, homebrew-formula, homebrew-smoke, verify, publish]
    if: needs.validate.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release
          path: candidate
      - name: Check verified digests at publish time
        run: node scripts/release-bundle.mjs verify candidate "$RELEASE_VERSION" "$GITHUB_SHA"
      - name: Publish npm packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-npm-release.mjs "$RELEASE_VERSION" candidate/npm

  homebrew-pr:
    name: Propose Homebrew Formula update
    needs: [validate, package, archives, npm-stage, homebrew-formula, homebrew-smoke, verify, publish, npm-publish]
    if: needs.validate.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release
          path: candidate
      - name: Check verified digests at publish time
        run: node scripts/release-bundle.mjs verify candidate "$RELEASE_VERSION" "$GITHUB_SHA"
      - name: Propose Homebrew Formula update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          formula="herdr-world.rb"
          if [[ "$RELEASE_VERSION" == *-rc.* ]]; then formula="herdr-world-rc.rb"; fi
          bash scripts/open-homebrew-pr.sh "$RELEASE_VERSION" "candidate/tap/Formula/$formula" --prepared "$PWD/candidate/tap"

  publication-status:
    name: Publication status and recovery
    needs: [validate, verify, publish, npm-publish, homebrew-pr]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Report public channels and the no-rebuild recovery command
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          DRY_RUN: ${{ needs.validate.outputs.dry_run }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BUNDLE_DIGEST: ${{ needs.verify.outputs.bundle_digest }}
        run: node scripts/release-status.mjs

  deploy-pages:
    name: Request stable Pages deployment
    needs: [publish, npm-publish, homebrew-pr]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy the current main website
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
