name: Release

on:
  push:
    tags: ["v*"]
  # Allows the Publish Release workflow (or a maintainer) to dispatch a run
  # on an existing tag ref.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publication
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Verify release metadata
        shell: bash
        run: |
          package_version="$(bun -e 'console.log(require("./package.json").version)')"
          web_version="$(bun -e 'console.log(require("./web/package.json").version)')"
          server_version="$(bun -e 'console.log(require("./server/package.json").version)')"
          plugin_version="$(bun -e 'const text = await Bun.file("herdr-plugin.toml").text(); console.log(text.match(/^version = "([^"]+)"/m)?.[1] ?? "")')"

          test "$package_version" = "0.0.0"
          test "$web_version" = "0.0.0"
          test "$server_version" = "0.0.0"
          test "$GITHUB_REF_NAME" = "v$plugin_version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -s "docs/releases/$GITHUB_REF_NAME.md"
          if [[ "$plugin_version" != *-rc.* ]]; then
            grep -q "^## \[$plugin_version\] - " CHANGELOG.md
          fi
      - name: Verify npm package bootstrap before publication
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
            npm view "@ivoryheart/herdr-world-$platform@0.0.0-seed.0" version --json >/dev/null || {
              echo "Bootstrap @ivoryheart/herdr-world-$platform and configure its trusted publisher before release" >&2
              exit 1
            }
          done
      - run: bun run precommit

  package:
    name: Package ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
          - windows-x64
          - windows-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Build release package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          HERDR_WORLD_BUILD_VERSION="$version" bun run package:${{ matrix.platform }}
      - name: Verify release package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          platform="${{ matrix.platform }}"
          package_dir="herdr-world-$platform"
          versioned_archive="herdr-world-v$version-$platform.tar.xz"
          latest_archive="herdr-world-$platform.tar.xz"

          for archive in "$versioned_archive" "$latest_archive"; do
            test -f "dist/$archive"
            test -f "dist/$archive.sha256"
            if command -v sha256sum >/dev/null 2>&1; then
              (cd dist && sha256sum -c "$archive.sha256")
            else
              (cd dist && shasum -a 256 -c "$archive.sha256")
            fi
          done

          manifest="dist/herdr-world-$platform.update.json"
          test -f "$manifest"
          if command -v sha256sum >/dev/null 2>&1; then
            archive_digest="$(sha256sum "dist/$latest_archive" | awk '{ print $1 }')"
          else
            archive_digest="$(shasum -a 256 "dist/$latest_archive" | awk '{ print $1 }')"
          fi
          expected_manifest="{\"schema\":1,\"name\":\"herdr-world\",\"version\":\"$version\",\"platform\":\"$platform\",\"archive\":\"$latest_archive\",\"sha256\":\"$archive_digest\"}"
          grep -Fx "$expected_manifest" "$manifest"

          extract_dir="$RUNNER_TEMP/herdr-world-release"
          mkdir -p "$extract_dir"
          tar -xJf "dist/$versioned_archive" -C "$extract_dir"
          grep -Fx "herdr-world $version $platform" "$extract_dir/$package_dir/VERSION"
          for legal in LICENSE THIRD_PARTY_NOTICES.md DEPENDENCY_NOTICES.md DEPENDENCY_LICENSES.md UPSTREAM.md; do
            test -f "$extract_dir/$package_dir/$legal"
          done
          test -f "$extract_dir/$package_dir/LICENSES/CLAW-EMPIRE-APACHE-2.0.txt"
          binary_name="herdr-world"
          case "$platform" in
            windows-*) binary_name="herdr-world.exe" ;;
          esac
          binary="$extract_dir/$package_dir/$binary_name"
          case "$platform" in
            linux-x64)
              test "$("$binary" --version)" = "herdr-world $version"
              ;;
            linux-arm64)
              file "$binary" | grep -Eq 'ELF 64-bit.*ARM aarch64'
              ;;
            darwin-x64)
              file "$binary" | grep -Eq 'Mach-O 64-bit.*x86_64'
              ;;
            darwin-arm64)
              file "$binary" | grep -Eq 'Mach-O 64-bit.*arm64'
              ;;
            windows-x64)
              file "$binary" | grep -Eq 'PE32\+ executable.*x86-64.*MS Windows'
              ;;
            windows-arm64)
              file "$binary" | grep -Eq 'PE32\+ executable.*Aarch64.*MS Windows'
              ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-world-${{ matrix.platform }}
          path: |
            dist/herdr-world-*.tar.xz*
            dist/herdr-world-*.update.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: herdr-world-*
          merge-multiple: true
      - name: Reject missing assets and legacy update aliases
        run: node scripts/check-release-assets.mjs "${GITHUB_REF_NAME#v}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          release_channel=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            release_channel=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/herdr-world-*.tar.xz \
            dist/herdr-world-*.tar.xz.sha256 \
            dist/herdr-world-*.update.json \
            scripts/install-herdr-world.sh \
            --verify-tag \
            "${release_channel[@]}" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --title "Herdr World $GITHUB_REF_NAME"

  published-archives:
    name: Verify published archives
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download and verify the assets served by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --dir dist
          node scripts/check-release-assets.mjs "${GITHUB_REF_NAME#v}" dist --published
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-archives
          path: |
            dist/herdr-world-v*.tar.xz
            dist/herdr-world-v*.tar.xz.sha256
          if-no-files-found: error
          retention-days: 7

  npm-stage:
    name: Stage npm packages
    needs: published-archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: published-archives
          path: dist
      - name: Stage and pack the verified binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bun scripts/stage-npm-release.ts "$version"
          mkdir -p dist/npm-tarballs
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
            npm pack "dist/npm/$platform" --pack-destination dist/npm-tarballs --silent
          done
          npm pack dist/npm/launcher --pack-destination dist/npm-tarballs --silent
          test "$(find dist/npm-tarballs -name '*.tgz' | wc -l)" -eq 7
          npm install --ignore-scripts --offline --prefix dist/npm-smoke \
            "./dist/npm-tarballs/ivoryheart-herdr-world-linux-x64-$version.tgz" \
            "./dist/npm-tarballs/ivoryheart-herdr-world-$version.tgz"
          test "$(dist/npm-smoke/node_modules/.bin/herdr-world --version)" = "herdr-world $version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-packages
          path: dist/npm-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  homebrew-formula:
    name: Generate Homebrew Formula
    needs: published-archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: published-archives
          path: dist
      - name: Generate Formula for the release channel
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          formula="herdr-world.rb"
          if [[ "$version" == *-rc.* ]]; then formula="herdr-world-rc.rb"; fi
          bun scripts/generate-homebrew-formula.ts "$version" dist "dist/$formula"
          ruby -c "dist/$formula"
          formula_class="HerdrWorld"
          if [[ "$version" == *-rc.* ]]; then formula_class="HerdrWorldRc"; fi
          ruby scripts/check-homebrew-formula-stage.rb "dist/$formula" \
            "dist/herdr-world-v$version-darwin-arm64.tar.xz" "$formula_class"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7
        with:
          name: homebrew-formula
          path: dist/herdr-world*.rb
          if-no-files-found: error
          retention-days: 7

  npm-publish:
    name: Publish npm packages
    needs: [publish, npm-stage]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-packages
          path: npm-packages
      - name: Publish platform packages, then the launcher
        run: node scripts/publish-npm-release.mjs "${GITHUB_REF_NAME#v}" npm-packages

  homebrew-pr:
    name: Propose Homebrew Formula update
    needs: [homebrew-smoke, homebrew-formula]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: homebrew-formula
          path: formula
      - name: Open tap pull request
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          formula="herdr-world.rb"
          if [[ "$version" == *-rc.* ]]; then formula="herdr-world-rc.rb"; fi
          bash scripts/open-homebrew-pr.sh "$version" "formula/$formula"

  homebrew-smoke:
    name: Homebrew install (${{ matrix.runner }})
    needs: [publish, homebrew-formula]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: homebrew-formula
          path: formula
      - name: Install the published archive through Homebrew
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          formula="herdr-world.rb"
          package="herdr-world"
          if [[ "$version" == *-rc.* ]]; then
            formula="herdr-world-rc.rb"
            package="herdr-world-rc"
          fi
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          tap="herdrworld/release-smoke"
          brew tap-new --no-git "$tap"
          install -m 0644 "./formula/$formula" "$(brew --repository "$tap")/Formula/$formula"
          brew install --formula "$tap/$package"
          test "$("$(brew --prefix "$tap/$package")/bin/herdr-world" --version)" = "herdr-world $version"
          brew test "$tap/$package"
