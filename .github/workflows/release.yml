name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-publication
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    name: Validate owner tag and recover retained tested bytes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      retained: ${{ steps.retained.outcome == 'success' && steps.seal.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - id: metadata
        run: bun scripts/release-plan.ts
      # Same workflow run only. The immutable artifact exists only after all
      # acceptance jobs pass. A full rerun can resume it; expiry rebuilds/tests.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        id: retained
        continue-on-error: true
        with:
          name: verified-release
          path: candidate
      # Reuse only a seal recording that every contract job succeeded in this
      # run; anything else builds and tests the tagged bytes again.
      - name: Check the retained seal came from a fully green run
        id: seal
        if: steps.retained.outcome == 'success'
        continue-on-error: true
        run: bun scripts/release-seal.ts check candidate

  candidate:
    name: Build and test the tagged bytes once
    needs: validate
    if: needs.validate.outputs.retained != 'true'
    uses: ./.github/workflows/release-candidate.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  publish:
    name: Publish tested GitHub assets
    needs: [validate, candidate]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.candidate.result == 'success' || (needs.candidate.result == 'skipped' && needs.validate.outputs.retained == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release
          path: candidate
      - name: Refuse changes to existing published bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Distinguish a missing release from authentication/network failure.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > tags.txt
          if grep -Fxq "$TAG" tags.txt; then
            mkdir existing
            gh release view "$TAG" --json assets --jq '.assets[].name' > names.txt
            if [ -s names.txt ]; then
              gh release download "$TAG" --dir existing
              for file in existing/*; do
                cmp "$file" "candidate/github/$(basename "$file")"
              done
            fi
          fi
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: candidate/github/*
          fail_on_unmatched_files: true
          overwrite_files: false
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: ${{ !contains(github.ref_name, '-rc.') }}

  npm-publish:
    name: Publish npm with provenance
    needs: [validate, publish]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release
          path: candidate
      - name: Publish the tested tarballs, retaining matching existing versions
        shell: bash
        run: |
          set -euo pipefail
          channel=latest
          if [[ "$RELEASE_VERSION" == *-rc.* ]]; then channel=next; fi
          # Platform packages first, launcher last; never pack again here.
          files=(candidate/npm/*-linux-*.tgz candidate/npm/*-darwin-*.tgz candidate/npm/*-windows-*.tgz "candidate/npm/ivoryheart-herdr-world-$RELEASE_VERSION.tgz")
          for file in "${files[@]}"; do
            package="$(tar -xOf "$file" package/package.json | jq -r '.name + "@" + .version')"
            integrity="sha512-$(openssl dgst -sha512 -binary "$file" | openssl base64 -A)"
            if npm view "$package" dist.integrity --json > integrity.json 2> npm-error.txt; then
              test "$(jq -r . integrity.json)" = "$integrity" || { echo "::error::Existing npm bytes differ for $package"; exit 1; }
            elif grep -q 'E404' npm-error.txt; then
              npm publish "$file" --provenance --access public --tag "$channel"
            else
              cat npm-error.txt >&2
              exit 1
            fi
          done

  homebrew-pr:
    name: Propose the tested multi-platform Formula
    environment: release
    needs: [validate, npm-publish]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.npm-publish.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release
          path: candidate
      - name: Find an existing tap proposal or already merged Formula
        id: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          formula=herdr-world
          if [[ "$RELEASE_VERSION" == *-rc.* ]]; then formula=herdr-world-rc; fi
          title="$formula $RELEASE_VERSION"
          branch="$(gh pr list -R IvoryHeart/homebrew-tap --base main --state open --json title,headRefName,isCrossRepository --jq ".[] | select(.title == \"$title\" and .isCrossRepository == false) | .headRefName")"
          if [ -n "$branch" ]; then
            [[ "$branch" =~ ^update-${formula}[.]rb-[0-9]+$ ]] || exit 1
          fi
          echo "formula=$formula" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          gh api "repos/IvoryHeart/homebrew-tap/contents/Formula/$formula.rb" --jq .content | base64 -d > published.rb
          merged=false
          if cmp -s published.rb "candidate/tap/Formula/$formula.rb"; then merged=true; fi
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
      # This standard action handles one URL. The standard PR action below
      # completes its SAME PR with our product's four URLs and install check.
      - uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v3
        if: steps.tap.outputs.branch == '' && steps.tap.outputs.merged != 'true'
        with:
          formula-name: ${{ steps.tap.outputs.formula }}
          homebrew-tap: IvoryHeart/homebrew-tap
          push-to: IvoryHeart/homebrew-tap
          create-pullrequest: true
          download-url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/herdr-world-${{ github.ref_name }}-darwin-arm64.tar.xz
          commit-message: "${{ steps.tap.outputs.formula }} ${{ needs.validate.outputs.version }}"
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Resolve the standard action's proposal branch
        id: proposal
        if: steps.tap.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          FORMULA: ${{ steps.tap.outputs.formula }}
        run: |
          branch="$(gh pr list -R IvoryHeart/homebrew-tap --base main --state open --json title,headRefName,isCrossRepository --jq ".[] | select(.title == \"$FORMULA $RELEASE_VERSION\" and .isCrossRepository == false) | .headRefName")"
          [[ "$branch" =~ ^update-${FORMULA}[.]rb-[0-9]+$ ]]
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.tap.outputs.merged != 'true'
        with:
          repository: IvoryHeart/homebrew-tap
          ref: main
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Apply the exact tested product Formula and tap check
        if: steps.tap.outputs.merged != 'true'
        run: cp -R candidate/tap/. tap/
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        if: steps.tap.outputs.merged != 'true'
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          branch: ${{ steps.proposal.outputs.branch }}
          base: main
          title: "${{ steps.tap.outputs.formula }} ${{ needs.validate.outputs.version }}"
          commit-message: "${{ steps.tap.outputs.formula }} ${{ needs.validate.outputs.version }}"
          body: Update the four native URLs and digests to the tested release bytes, retaining the tap's own macOS install check. Merge to publish Homebrew.

  release-label:
    name: Complete release-please lifecycle
    needs: [validate, homebrew-pr]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.homebrew-pr.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # PR-only release-please never runs createReleases, which normally clears
      # pending. Finish its lifecycle automatically after every channel publishes.
      - name: Mark the published release PR as tagged
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/commits/$TAG_COMMIT/pulls?per_page=100" > pulls.json
          pr="$(jq -ser --arg sha "$TAG_COMMIT" '[.[][] | select(.base.ref == "main" and .merged_at != null and .merge_commit_sha == $sha) | select(any(.labels[]; .name == "autorelease: pending" or .name == "autorelease: tagged"))] | if length == 1 then .[0].number else error("Expected one merged release PR for the published tag") end' pulls.json)"
          gh label create 'autorelease: tagged' --force --color ededed --description 'Release published'
          gh pr edit "$pr" --add-label 'autorelease: tagged' --remove-label 'autorelease: pending'

  publication-status:
    name: Release result
    needs: [validate, candidate, publish, npm-publish, homebrew-pr, release-label]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: One-line failure and recovery
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in jobs.items() if job['result'] != 'success' and not (name == 'candidate' and job['result'] == 'skipped')]
          line = ('Release complete; merge the Homebrew tap PR.' if not failed else
                  'Release stopped at ' + failed[0] + '; re-run failed jobs to resume the tested bytes and finish remaining channels.')
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary: summary.write(line + '\n')
          if failed: raise SystemExit(1)
          PYTHON

  deploy-pages:
    name: Request stable Pages deployment
    needs: [publish, npm-publish]
    if: ${{ !cancelled() && !failure() && !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy the current main website
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
