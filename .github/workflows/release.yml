name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-publication
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    name: Wait for this version commit on main
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      run: ${{ steps.seal.outputs.run }}
      artifact: ${{ steps.seal.outputs.artifact }}
      rebuild: ${{ steps.seal.outputs.rebuild }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - id: metadata
        run: bun scripts/release-plan.ts
      - id: seal
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-walk-gate.ts "${{ steps.metadata.outputs.commit }}"

  rebuild:
    needs: validate
    if: needs.validate.outputs.rebuild == 'true'
    uses: ./.github/workflows/release-candidate.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  acquire:
    name: Retain the tested seal in this run
    needs: [validate, rebuild]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.rebuild.result == 'success' || (needs.rebuild.result == 'skipped' && needs.validate.outputs.rebuild == 'false')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.validate.outputs.rebuild == 'false'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate.outputs.run }}
          artifact-ids: ${{ needs.validate.outputs.artifact }}
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.validate.outputs.rebuild == 'true'
        with:
          name: verified-release
          path: candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.validate.outputs.rebuild == 'false'
        with:
          name: verified-release
          path: candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: [validate, acquire]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release
          path: candidate
      - name: Check verified digests at publish time
        run: node scripts/release-bundle.mjs verify candidate "$RELEASE_VERSION" "${{ needs.validate.outputs.commit }}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-github-release.mjs "$RELEASE_VERSION" candidate "${{ needs.validate.outputs.commit }}"

  npm-publish:
    name: Publish npm packages
    needs: [validate, acquire, publish]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release
          path: candidate
      - name: Check verified digests at publish time
        run: node scripts/release-bundle.mjs verify candidate "$RELEASE_VERSION" "${{ needs.validate.outputs.commit }}"
      - name: Publish npm packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-npm-release.mjs "$RELEASE_VERSION" candidate/npm

  homebrew-pr:
    name: Propose Homebrew Formula update
    needs: [validate, acquire, npm-publish]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release
          path: candidate
      - name: Check verified digests at publish time
        run: node scripts/release-bundle.mjs verify candidate "$RELEASE_VERSION" "${{ needs.validate.outputs.commit }}"
      - name: Propose Homebrew Formula update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          formula="herdr-world.rb"
          if [[ "$RELEASE_VERSION" == *-rc.* ]]; then formula="herdr-world-rc.rb"; fi
          bash scripts/open-homebrew-pr.sh "$RELEASE_VERSION" "candidate/tap/Formula/$formula" --prepared "$PWD/candidate/tap"

  publication-status:
    name: Release result
    needs: [validate, rebuild, acquire, publish, npm-publish, homebrew-pr]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: One-line failure and recovery
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in jobs.items() if job['result'] in ('failure', 'cancelled')]
          failed = failed or [name for name, job in jobs.items() if name != 'rebuild' and job['result'] != 'success']
          line = ('Release complete; merge the Homebrew tap PR.' if not failed else
                  'Release stopped at ' + failed[0] + '; re-run this tag to verify existing publications and finish remaining channels.')
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary: summary.write(line + '\n')
          if failed: raise SystemExit(1)
          PYTHON

  deploy-pages:
    name: Request stable Pages deployment
    needs: [publish, npm-publish]
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy the current main website
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
