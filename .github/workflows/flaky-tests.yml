name: Flaky test tracking

on:
  workflow_run:
    workflows: [CI]
    types: [requested, completed]

permissions:
  contents: read
  actions: read
  issues: write
  statuses: write

# One writer across PRs, branches and attempts; never cancel a pending occurrence.
concurrency:
  group: flaky-test-tracking
  queue: max

jobs:
  track:
    # Fork artifacts must never reach the write-enabled tracker.
    if: github.event.workflow_run.head_repository.full_name == github.repository
    name: Record advisory flaky accounting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run uses trusted default-branch code, never the source PR ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - name: Mark optional Flaky accounting pending
        if: github.event.action == 'requested'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: bun scripts/flaky-tests.ts pending
      - name: Catch up retained source evidence and record advisory accounting
        if: github.event.action == 'completed'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: bun scripts/flaky-tests.ts track
