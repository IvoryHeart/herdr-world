name: Daily flaky tests

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

# One active writer and at most one pending run coalesce manual/scheduled bursts.
concurrency:
  group: daily-flaky-tests
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Report the last 24 hours of retries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - name: Update the Flaky tests issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/flaky-tests.ts daily
