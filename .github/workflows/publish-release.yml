name: Publish Release

# Tag the reviewed version-changing merge, never moving main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (X.Y.Z or X.Y.Z-rc.N)
        required: true
        type: string
      automatic:
        description: Publish only a reviewed daily patch PR
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: publish-release
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    name: Tag and start release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
          no-cache: true
      - id: candidate
        name: Verify reviewed release and publication state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          AUTOMATIC: ${{ inputs.automatic }}
        run: bun scripts/daily-release.ts publication
      - name: Retry failed Release jobs on the same immutable tag
        if: steps.candidate.outputs.mode == 'retry'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: gh run rerun "$RELEASE_RUN_ID" --failed --repo IvoryHeart/herdr-world
      - name: Create the reviewed annotated tag
        if: steps.candidate.outputs.mode == 'tag'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
          TAG: ${{ steps.candidate.outputs.tag }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "Configure RELEASE_AUTOMATION_TOKEN for an identity allowed by the release-tag ruleset."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Herdr World $VERSION" "$RELEASE_SHA"
          gh auth setup-git
          git push origin "refs/tags/$TAG"
          # The dedicated token's push starts Release. Do not also dispatch it.
      - name: Start Release on an existing inspected tag
        if: steps.candidate.outputs.mode == 'dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
        run: gh workflow run release.yml --repo IvoryHeart/herdr-world --ref "$TAG"
