name: Publish Release

# Run this after the matching Prepare Release PR has merged. The matching
# release commit on main is tagged, then Release is dispatched on that tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (X.Y.Z or X.Y.Z-rc.N)
        required: true
        type: string
      create_tag:
        description: Create the authorized tag automatically only if the tag ruleset permits the workflow token
        required: false
        default: false
        type: boolean
      walk_run_id:
        description: Successful main CI run containing the exact release walk packages
        required: true
        type: string
      release_pr:
        description: Merged release PR recording the signed-in receipt digest
        required: true
        type: string
      signed_in_receipt:
        description: JSON receipt from the local signed-in walk of a downloaded CI package
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-release
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    name: Tag and start release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.authorize.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - id: authorize
        name: Verify metadata and authorize before tagging
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          WALK_RUN_ID: ${{ inputs.walk_run_id }}
          RELEASE_PR: ${{ inputs.release_pr }}
          RELEASE_WALK_SIGNED_RECEIPT: ${{ inputs.signed_in_receipt }}
          RELEASE_WALK_AUTHORIZATION: ${{ runner.temp }}/authorization.json
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "error: version must be X.Y.Z or X.Y.Z-rc.N" >&2
            exit 1
          fi

          read_plugin_version_at() {
            git show "$1:herdr-plugin.toml" \
              | bun -e 'const text = await Bun.stdin.text(); console.log(text.match(/^version = "([^"]+)"/m)?.[1] ?? "")'
          }

          # Find the first-parent commit that changed the public plugin version
          # to VERSION. Private package manifests intentionally stay at 0.0.0.
          release_sha=""
          while read -r candidate_sha; do
            if [ "$(read_plugin_version_at "$candidate_sha")" != "$VERSION" ]; then
              continue
            fi
            parent_sha="$(git rev-parse "${candidate_sha}^1" 2>/dev/null || true)"
            if [ -z "$parent_sha" ] || \
              [ "$(read_plugin_version_at "$parent_sha")" != "$VERSION" ]; then
              release_sha="$candidate_sha"
              break
            fi
          done < <(git rev-list --first-parent origin/main -- herdr-plugin.toml)

          if [ -z "$release_sha" ]; then
            echo "error: no release commit for $VERSION exists on main" >&2
            exit 1
          fi

          test "$(read_plugin_version_at "$release_sha")" = "$VERSION"
          for manifest in package.json web/package.json server/package.json; do
            test "$(git show "$release_sha:$manifest" | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).version)')" = "0.0.0"
          done

          if git rev-parse --verify --quiet "refs/tags/v$VERSION" >/dev/null; then
            echo "error: tag already exists; reuse its original pre-tag authorization run" >&2
            exit 1
          fi
          # The exact Linux/macOS bytes and signed-in receipt pass before any tag exists.
          bun scripts/release-walk-gate.ts authorize "$release_sha" "$VERSION" "$WALK_RUN_ID" "$RELEASE_PR"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Authorized v$VERSION at $release_sha. A maintainer may now create this annotated tag and dispatch Release with publish_run_id=$GITHUB_RUN_ID." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-walk-authorization
          path: ${{ runner.temp }}/authorization.json
          if-no-files-found: error
          retention-days: 30
      - name: Create the authorized tag
        if: inputs.create_tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.authorize.outputs.tag }}
          RELEASE_SHA: ${{ steps.authorize.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Herdr World $TAG" "$RELEASE_SHA"
          gh auth setup-git
          git push origin "$TAG"
      - name: Start Release workflow
        if: inputs.create_tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.authorize.outputs.tag }}
        run: |
          gh workflow run "Release" --ref "$TAG" -f dry_run=false -f publish_run_id="$GITHUB_RUN_ID"
