name: CI supersede

# CI never cancels a run in flight. A new commit's CI run queues behind the
# PR's current one; this cancels that older run only when it tests a different
# tree, so a re-push of an identical tree keeps its run and the queued run
# reuses the result (scripts/ci-supersede.ts).
on:
    pull_request:
        types: [synchronize]

permissions:
    contents: read
    actions: write

concurrency:
    group: ci-supersede-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    supersede:
        name: Supersede older CI runs
        if: github.event.pull_request.state == 'open'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.4"
                  no-cache: true
            - name: Cancel in-flight CI runs that test a different tree
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: bun scripts/ci-supersede.ts
