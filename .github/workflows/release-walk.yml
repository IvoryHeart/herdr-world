name: Release walk

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      listing_repetitions:
        description: Extra independent listing journeys (0-100, stops on first failure)
        type: number
        default: 0

permissions:
  contents: read

jobs:
  baseline:
    name: Freeze previous published release for the walk
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.baseline.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun -e 'import { latestStableRelease } from "./scripts/installer-upgrade"; console.log("tag=" + (await latestStableRelease()).tag)' >> "$GITHUB_OUTPUT"
  walk:
    name: Release walk (${{ matrix.platform }})
    needs: baseline
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Select exact package version
        id: version
        env:
          PR: ${{ github.event_name == 'pull_request' }}
        run: |
          bun -e 'const text = await Bun.file("herdr-plugin.toml").text(); const version = process.env.PR === "true" ? `0.0.0-rc.${process.env.GITHUB_RUN_NUMBER}` : text.match(/^version = "([^"]+)"/m)[1]; console.log(`version=${version}`)' >> "$GITHUB_OUTPUT"
      - name: Start the disposable runner user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Walk the release build on real runtimes and signed-out harnesses
        env:
          GH_TOKEN: ${{ github.token }}
          LISTING_REPETITIONS: ${{ inputs.listing_repetitions || 0 }}
        run: bun run test:release-walk --disposable-host --version "${{ steps.version.outputs.version }}" --baseline-tag "${{ needs.baseline.outputs.tag }}" --listing-repetitions "$LISTING_REPETITIONS" --report "${{ runner.temp }}/release-walk/report.json"
      - name: Record historical launch proof
        if: always() && matrix.platform == 'linux-x64'
        run: |
          if [ -f "$RUNNER_TEMP/release-walk/report.json" ]; then
            bun -e 'const r = await Bun.file(process.env.RUNNER_TEMP + "/release-walk/report.json").json(); console.log("v0.3.5 negative control: " + JSON.stringify(r.negative_control ?? {status:"not-run"})); console.log("Release walk: " + r.status)' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-walk-report-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-walk/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain redacted listing failure evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: release-walk-listing-failure-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-walk/listing-failure.json
          if-no-files-found: ignore # Other journeys do not create listing evidence.
          retention-days: 30
      - name: Retain listing repetition evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && inputs.listing_repetitions > 0
        with:
          name: release-walk-listing-batch-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-walk/listing-batch.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-walk-package-${{ matrix.platform }}
          path: |
            dist/herdr-world-*.tar.xz*
            dist/herdr-world-*.update.json
          if-no-files-found: error
          retention-days: 30
