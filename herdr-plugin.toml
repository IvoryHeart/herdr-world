id = "ivoryheart.herdr-world"
name = "Herdr World"
version = "0.2.7"
min_herdr_version = "0.9.0"
description = "A visual IDE for AI agents. Focus your attention with office, mindmaps and boards. Chat with agents, review files and changes. Play with your agents."
platforms = ["linux", "macos", "windows"]

# System installers verify the matching World release without external Bun.
# A native compatibility launcher preserves the frozen cached action argv.
# Unreleased checkouts require `bun scripts/world-plugin.ts build-source`, then
# `herdr plugin link .`; see docs/DEPLOYMENT.md#herdr-plugin.
# The panel opens as a session-modal popup in the Herdr TUI by default. Open
# it with --placement split (or tab/zoomed/overlay) to get a regular pane
# that other Herdr clients, including Herdr World itself, can see.

[[build]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/install-plugin.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell.exe", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/install-plugin.ps1"]

[[panes]]
id = "panel"
title = "Herdr World"
placement = "popup"
width = "72%"
height = 12
command = ["server/herdr-world-plugin.exe", "panel"]

[[actions]]
id = "start"
title = "Start Herdr World"
contexts = ["workspace"]
command = ["server/herdr-world-plugin.exe", "start"]

[[actions]]
id = "restart"
title = "Restart Herdr World"
contexts = ["workspace"]
command = ["server/herdr-world-plugin.exe", "restart"]

[[actions]]
id = "status"
title = "Herdr World status"
contexts = ["workspace"]
command = ["server/herdr-world-plugin.exe", "status"]

[[actions]]
id = "url"
title = "Show Herdr World URL"
contexts = ["workspace"]
command = ["server/herdr-world-plugin.exe", "url"]

[[actions]]
id = "version"
title = "Show Herdr World version"
contexts = ["workspace"]
command = ["server/herdr-world-plugin.exe", "version"]

[[actions]]
id = "uninstall"
title = "Uninstall Herdr World service"
contexts = ["workspace"]
command = ["server/herdr-world-plugin.exe", "uninstall"]
