<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title description">
  <title id="title">Office pane presence design sketch</title>
  <desc id="description">A tab desk with a central laptop showing its pane count, three clickable monitors to the left, right and above, nearby working agents, a shared reception table for agents needing input or done, compact overflow positions, and an idle agent at the bar.</desc>
  <defs>
    <pattern id="floor" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#151b28"/>
      <rect width="10" height="10" fill="#182031"/>
      <rect x="10" y="10" width="10" height="10" fill="#182031"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#f0c878"/>
    </marker>
    <g id="agent" shape-rendering="crispEdges">
      <path d="M-12 6H12V18H-12Z" fill="#50679a" stroke="#9db5d9" stroke-width="2"/>
      <path d="M-7 18H-2V26H-7ZM2 18H7V26H2Z" fill="#303b5e"/>
      <path d="M-9-19H9V5H-9Z" fill="#dcb48d" stroke="#674957" stroke-width="2"/>
      <path d="M-11-21H9V-13H-11Z" fill="#594557"/>
      <path d="M-5-5H-2V-2H-5ZM3-5H6V-2H3Z" fill="#273043"/>
    </g>
    <g id="laptop" shape-rendering="crispEdges">
      <rect x="-18" y="-15" width="36" height="25" rx="2" fill="#0d1823" stroke="#85a5bd" stroke-width="3"/>
      <rect x="-14" y="-11" width="28" height="17" fill="#347d86"/>
      <path d="M-20 11H20L16 16H-16Z" fill="#9aacc1" stroke="#d4e7e6" stroke-width="2"/>
      <rect x="-3" y="12" width="6" height="2" fill="#4b6473"/>
    </g>
    <g id="monitor" shape-rendering="crispEdges">
      <rect x="-10" y="-10" width="20" height="15" rx="2" fill="#182437" stroke="#85a5bd" stroke-width="1"/>
      <rect x="-8" y="-8" width="16" height="10" fill="#347d86"/>
    </g>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      .heading { font-size: 22px; font-weight: 700; fill: #f4e6c0; }
      .section { font-size: 14px; font-weight: 700; fill: #f4e6c0; letter-spacing: 1px; }
      .small { font-size: 12px; fill: #cbd7dc; }
      .tiny { font-size: 10px; fill: #b9c9cf; }
      .callout { font-size: 12px; fill: #f0c878; font-weight: 700; }
    </style>
  </defs>

  <rect width="1080" height="650" fill="#0d1120"/>
  <text x="35" y="40" class="heading">OFFICE PRESENCE — DESIGN SKETCH</text>
  <text x="35" y="63" class="small">Conceptual placement and interaction; all labels and entities are synthetic.</text>

  <!-- A work room keeps the tab desk, while its additional panes gain small stations. -->
  <rect x="32" y="85" width="620" height="440" rx="6" fill="url(#floor)" stroke="#6a8278" stroke-width="3"/>
  <rect x="33" y="85" width="618" height="40" fill="#20503d"/>
  <text x="52" y="111" class="section">WORK ROOM · SPACE 01</text>
  <rect x="225" y="145" width="230" height="26" rx="4" fill="#1c2736" stroke="#51b677" stroke-width="2"/>
  <text x="340" y="163" class="small" text-anchor="middle">TAB 03 · SHARED DESK</text>

  <!-- Existing tab desk and integrated monitor. -->
  <ellipse cx="340" cy="395" rx="105" ry="12" fill="#080d15" opacity=".45"/>
  <rect x="243" y="351" width="194" height="45" rx="4" fill="#765b38" stroke="#d5a76b" stroke-width="3"/>
  <rect x="249" y="356" width="182" height="30" rx="3" fill="#ae8b5d"/>
  <use href="#laptop" transform="translate(340 373) scale(.55)"/>
  <text x="340" y="374" font-size="8" font-weight="700" fill="#eff7ff" text-anchor="middle">4</text>
  <text x="340" y="420" class="small" text-anchor="middle">Laptop shows 4 active panes</text>

  <!-- Pane devices stay inside the existing desk footprint. -->
  <use href="#monitor" x="279" y="373"/>
  <use href="#monitor" x="401" y="373"/>
  <use href="#monitor" x="340" y="332"/>
  <text x="279" y="404" class="tiny" text-anchor="middle">PANE A</text>
  <text x="401" y="404" class="tiny" text-anchor="middle">PANE B</text>
  <text x="340" y="315" class="tiny" text-anchor="middle">PANE C</text>
  <use href="#agent" transform="translate(290 242) scale(.7)"/>
  <use href="#agent" x="340" y="242"/>
  <use href="#agent" transform="translate(390 242) scale(.7)"/>
  <text x="290" y="284" class="small" text-anchor="middle">A</text>
  <text x="340" y="284" class="small" text-anchor="middle">Main</text>
  <text x="390" y="284" class="small" text-anchor="middle">B</text>
  <text x="340" y="298" class="tiny" text-anchor="middle">WORKING TOGETHER · ONE DESK CELL</text>
  <text x="52" y="459" class="callout">Pane devices stay by the desk when agents leave.</text>
  <text x="52" y="480" class="small">Select a device to inspect its exact pane; activate it to open that terminal.</text>
  <text x="52" y="501" class="tiny">Device targets and the tab desk remain distinct; labels carry pane identity.</text>

  <!-- One reception table serves both actionable statuses. -->
  <rect x="680" y="85" width="368" height="296" rx="6" fill="#151529" stroke="#8d7135" stroke-width="3"/>
  <rect x="681" y="85" width="366" height="40" fill="#443724"/>
  <text x="699" y="111" class="section">SHARED RECEPTION · HOST 01</text>
  <use href="#agent" x="772" y="198"/>
  <use href="#agent" x="948" y="198"/>
  <rect x="798" y="153" width="28" height="28" rx="4" fill="#ec8799"/>
  <text x="812" y="175" font-size="23" font-weight="700" fill="#251923" text-anchor="middle">?</text>
  <rect x="972" y="153" width="28" height="28" rx="4" fill="#f0c878"/>
  <path d="M978 168l5 5 10-12" fill="none" stroke="#281d0f" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
  <text x="772" y="246" class="small" text-anchor="middle">Needs input</text>
  <text x="948" y="246" class="small" text-anchor="middle">Done</text>
  <rect x="749" y="269" width="230" height="48" rx="16" fill="#765437" stroke="#c0995b" stroke-width="3"/>
  <text x="864" y="299" class="small" text-anchor="middle">RECEPTION TABLE</text>
  <path d="M737 341h254" stroke="#73708d" stroke-width="2" stroke-dasharray="6 5"/>
  <use href="#agent" transform="translate(770 352) scale(.55)" opacity=".7"/>
  <use href="#agent" transform="translate(834 352) scale(.55)" opacity=".7"/>
  <use href="#agent" transform="translate(898 352) scale(.55)" opacity=".7"/>
  <use href="#agent" transform="translate(962 352) scale(.55)" opacity=".7"/>
  <text x="864" y="370" class="tiny" text-anchor="middle">Standing positions when chairs fill · +N in roster</text>

  <!-- The bar remains for idle agents. -->
  <rect x="680" y="399" width="368" height="126" rx="6" fill="#221b28" stroke="#8d7135" stroke-width="3"/>
  <text x="699" y="426" class="section">AGENT BAR</text>
  <rect x="710" y="486" width="306" height="20" rx="5" fill="#765437" stroke="#c0995b" stroke-width="2"/>
  <use href="#agent" x="852" y="465"/>
  <text x="911" y="468" class="small">IDLE</text>
  <text x="911" y="484" class="tiny">after handling</text>

  <path d="M34 555h1013" stroke="#465467" stroke-width="2"/>
  <text x="35" y="579" class="callout">INTERACTION</text>
  <text x="35" y="601" class="small">Each pane device retains a qualified pane target. Its screen can dim when the agent moves away.</text>
  <text x="35" y="623" class="small">Reception symbols repeat the spoken status; the originating desk keeps its existing completion paper.</text>
</svg>
