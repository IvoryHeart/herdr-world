<text x="32" y="36" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#ffffff" font-weight="600">Wide town: the University stands between the town center and the library</text>
<text x="32" y="56" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#737aa2" font-weight="400">Drawn to scale, 8 px per 16-px tile. Post office, town center, University, library, observatory.</text>
<text x="32" y="82" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#c0caf5" font-weight="600">Today</text>
