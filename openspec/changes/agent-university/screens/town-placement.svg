<text x="500" y="354" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#ffffff" font-weight="600">a hire walks out of the University gate to its room</text>
<text x="32" y="500" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#e0af68" font-weight="600">Moves, once, when the University ships:</text>
<text x="32" y="520" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#c0caf5" font-weight="400">  the library and observatory, 20 tiles right (18-tile lot + 2-tile gap);</text>
<text x="32" y="540" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#c0caf5" font-weight="400">  the shore (warehouse, harbour, shipyard), because the town grows 20 tiles wider.</text>
<text x="32" y="560" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#c0caf5" font-weight="400">Stays: post office, town center, every room, street, desk and agent.</text>
<text x="32" y="580" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#c0caf5" font-weight="400">After that nothing moves: a wing appearing for a new harness stays inside the University lot.</text>
<text x="32" y="620" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#737aa2" font-weight="400">See direction-*-laptop.png for the real Town with the University in place.</text>
<text x="970" y="36" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#ffffff" font-weight="600">Narrow (phone) town</text>
<text x="970" y="56" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#737aa2" font-weight="400">Civic row along the top, right of the rooms (#1351).</text>
