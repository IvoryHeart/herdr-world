# Copy only into a fresh trial worktree's .codex/config.toml.
# Sol/high trial allocation; preserve credentials, approvals and telemetry.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[features]
goals = true
multi_agent = true

[agents]
enabled = true
max_threads = 3
max_depth = 1
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "high"
