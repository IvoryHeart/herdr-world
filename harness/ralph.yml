# Runtime paths are resolved into an immutable per-run control copy by run.mjs.
event_loop:
  completion_promise: LOOP_COMPLETE
  cancellation_promise: task.blocked
  starting_event: plan.start
  required_events: [review.passed, qa.passed, candidate.verified]
  enforce_hat_scope: true
  max_iterations: 24
  max_runtime_seconds: 3600
  max_consecutive_failures: 3
  persistent: false
cli:
  backend: custom
  command: node
  args: [scripts/agent/backend.mjs, coordinator]
  prompt_mode: stdin
  default_mode: autonomous
# Ralph 2.10.1 routes custom `node` backend settings through its `claude` fallback
# slot. This selects an inactivity timeout, not a model/provider. The adapter's
# cumulative stage budgets and outer run deadline remain authoritative. The runner
# materializes this fallback above the run ceiling so it cannot cut off productive work.
adapters:
  claude:
    timeout: 3630
core:
  specs_dir: openspec/specs
  scratchpad:
    enabled: true
    path: .ralph/agent/scratchpad.md
  guardrails:
    - Follow AGENTS.md and the authorized task; current contracts live in openspec.
    - Do not push, merge, publish, contact live Herdr, or alter verification controls.
    - Return the structured response requested by the adapter; it owns event emission.
memories:
  enabled: false
tasks:
  enabled: false
features:
  parallel: false
  auto_merge: false
  preflight:
    enabled: false
hooks:
  enabled: true
  events:
    pre.loop.complete:
      - name: exact-candidate-gate
        command: [node, scripts/agent/gate.mjs]
        on_error: block
        timeout_seconds: 30
hats:
  product:
    name: Product manager
    description: Shape an authorized feature into observable acceptance criteria.
    triggers: [product.start]
    publishes: [requirements.ready, task.blocked]
    backend:
      command: node
      args: [scripts/agent/backend.mjs, product]
    max_activations: 2
    instructions: Read harness/roles/product.md.
  planner:
    name: Planner
    description: Ground the task in source and current knowledge.
    triggers: [plan.start, requirements.ready]
    publishes: [plan.ready, oracle.requested, task.blocked]
    backend:
      command: node
      args: [scripts/agent/backend.mjs, planner]
    max_activations: 4
    instructions: Read harness/roles/planner.md.
  qa-planner:
    name: QA planner
    description: Derive independent behavioral scenarios before implementation.
    triggers: [plan.ready, qa.plan]
    publishes: [qa.planned, oracle.requested, task.blocked]
    backend:
      command: node
      args: [scripts/agent/backend.mjs, qa-planner]
    max_activations: 4
    instructions: Read harness/roles/qa-planner.md.
  implementer:
    name: Implementer
    description: Implement and verify the bounded task, including knowledge updates.
    triggers: [qa.planned, implementation.start, review.rejected, qa.failed, verification.failed]
    publishes: [candidate.ready, oracle.requested, task.blocked]
    backend:
      command: node
      args: [scripts/agent/backend.mjs, implementer]
    max_activations: 4
    instructions: Read harness/roles/implementer.md.
  reviewer:
    name: Reviewer
    description: Inspect the current candidate in an independent read-only history.
    triggers: [candidate.ready]
    publishes: [review.passed, review.rejected, oracle.requested, task.blocked]
    backend:
      command: node
      args: [scripts/agent/backend.mjs, reviewer]
    max_activations: 4
    instructions: Read harness/roles/reviewer.md.
  qa:
    name: Behavioral QA
    description: Exercise every independent scenario against the reviewed candidate.
    triggers: [review.passed, qa.start]
    publishes: [qa.passed, qa.failed, oracle.requested, task.blocked]
    backend:
      command: node
      args: [scripts/agent/backend.mjs, qa]
    max_activations: 4
    instructions: Read harness/roles/qa.md.
  oracle:
    name: Oracle technical adviser
    description: Bounded read-only investigation of technical uncertainty or repeated failure.
    triggers: [oracle.requested]
    publishes: [plan.start, qa.plan, implementation.start, candidate.ready, qa.start, task.blocked]
    backend:
      command: node
      args: [scripts/agent/backend.mjs, oracle]
    max_activations: 2
    instructions: Read harness/roles/oracle.md; the adapter owns the return event.
  verifier:
    name: Verifier
    description: Execute deterministic checks outside the agent session.
    triggers: [qa.passed]
    publishes: [candidate.verified, verification.failed, oracle.requested, task.blocked]
    backend:
      command: node
      args: [scripts/agent/backend.mjs, verifier]
    max_activations: 4
    instructions: The adapter runs the checks; no model call is needed.
